<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f28c00">
  <title>Acceso · Bizkaibus SAE Spotter</title>
  <meta name="description" content="Acceso al panel Bizkaibus SAE Spotter.">
  <link rel="stylesheet" href="./login.css?v=20261017a">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase-config.js"></script>
  <script src="./login.js?v=20261017a" defer></script>
</head>
<body>
  <main class="login-card">
    <div class="login-icon" aria-hidden="true">🚌</div>
    <p class="eyebrow">SAE · BIZKAIBUS</p>
    <h1>Bizkaibus <span>Spotter</span></h1>
    <p class="subtitle">Inicia sesión para acceder al panel.</p>

    <form id="loginForm">
      <label for="email">Correo electrónico</label>
      <input id="email" name="email" type="email" placeholder="tu@correo.com"
        autocomplete="username" required>

      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password"
        placeholder="Introduce tu contraseña" autocomplete="current-password" required>

      <p id="loginMessage" role="status" aria-live="polite"></p>
      <button id="loginButton" type="submit">Iniciar sesión</button>
    </form>

    <p class="login-footer">Acceso para usuarios autorizados</p>
  </main>
</body>
</html>
