<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17212b">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SAE Spotter">
  <title>Crear contraseña · SAE Spotter</title>
  <meta name="description" content="Configura tu contraseña para acceder a SAE Spotter.">
  <link rel="stylesheet" href="./login.css?v=20261019a">
  <style>
    #loginMessage.success { color: #067647; }
    .back-link { display:block; margin-top:14px; color:#a95c00; text-align:center; font-size:12px; font-weight:700; }
    #passwordForm[hidden] { display:none; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase-config.js"></script>
  <script src="./set-password.js?v=20261019a" defer></script>
  <script src="./pwa.js?v=20261018a" defer></script>
</head>
<body>
  <main class="login-card">
    <div class="login-icon" aria-hidden="true">🚌</div>
    <p class="eyebrow">INVITACIÓN · SAE</p>
    <h1>Crea tu <span>contraseña</span></h1>
    <p class="subtitle">Elige una contraseña personal para entrar en SAE Spotter. No la compartas con nadie.</p>

    <form id="passwordForm" hidden>
      <label for="password">Nueva contraseña</label>
      <input id="password" name="password" type="password"
        placeholder="Mínimo 8 caracteres" autocomplete="new-password"
        minlength="8" required>

      <label for="passwordConfirm">Repite la contraseña</label>
      <input id="passwordConfirm" name="passwordConfirm" type="password"
        placeholder="Repite tu contraseña" autocomplete="new-password"
        minlength="8" required>

      <p id="loginMessage" role="status" aria-live="polite">Validando invitación…</p>
      <button id="savePasswordButton" type="submit">Guardar contraseña</button>
    </form>

    <p id="pageMessage" role="status" aria-live="polite">Validando el enlace de invitación…</p>
    <a class="back-link" href="./login.html">Volver al inicio de sesión</a>
    <p class="login-footer">SAE Spotter · Acceso para usuarios autorizados</p>
  </main>
</body>
</html>
