name: Vigilar SAE y Telegram

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"
  workflow_run:
    workflows: ["Actualizar posiciones Bizkaibus"]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: vigilar-sae-telegram
  cancel-in-progress: false

jobs:
  watchdog:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Descargar estado de vigilancia
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Comprobar actualización y avisar por Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
          FAILED_RUN_URL: ${{ github.event.workflow_run.html_url }}
          FAILED_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import time
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          token = (os.environ.get("TELEGRAM_BOT_TOKEN") or "").strip()
          chat_id = (os.environ.get("TELEGRAM_CHAT_ID") or "").strip()
          gh_token = (os.environ.get("GITHUB_TOKEN") or "").strip()
          repo = (os.environ.get("GITHUB_REPOSITORY") or "").strip()
          event_name = os.environ.get("EVENT_NAME", "")
          state_path = "sae-watchdog-state.json"

          if not token or not chat_id or not gh_token or not repo:
              raise SystemExit("Faltan secretos o datos necesarios para la vigilancia.")

          try:
              with open(state_path, encoding="utf-8") as f:
                  state = json.load(f)
          except FileNotFoundError:
              state = {"incidentActive": False, "lastFailureRunId": ""}
          if not isinstance(state, dict):
              state = {"incidentActive": False, "lastFailureRunId": ""}

          def telegram_send(text):
              endpoint = "https://api.telegram.org/bot" + token + "/sendMessage"
              last_error = None
              for attempt in range(4):
                  request = urllib.request.Request(
                      endpoint,
                      data=json.dumps({
                          "chat_id": chat_id,
                          "text": text,
                          "disable_web_page_preview": True,
                      }, ensure_ascii=False).encode("utf-8"),
                      headers={"Content-Type": "application/json"},
                      method="POST",
                  )
                  try:
                      with urllib.request.urlopen(request, timeout=20) as response:
                          result = json.loads(response.read().decode("utf-8"))
                      if result.get("ok"):
                          return
                      retry_after = (result.get("parameters") or {}).get("retry_after")
                      last_error = RuntimeError(result.get("description", "Error de Telegram"))
                      if attempt < 3 and (retry_after or "temporar" in str(last_error).lower()):
                          time.sleep(min(60, max(1, int(retry_after or 2 ** attempt))))
                          continue
                      raise last_error
                  except urllib.error.HTTPError as exc:
                      last_error = RuntimeError("Telegram HTTP " + str(exc.code))
                      if attempt >= 3 or not (exc.code == 429 or 500 <= exc.code < 600):
                          raise last_error
                      time.sleep(min(30, 2 ** attempt))
                  except (urllib.error.URLError, TimeoutError, OSError, json.JSONDecodeError) as exc:
                      last_error = exc
                      if attempt >= 3:
                          raise RuntimeError("No se pudo enviar la alerta de vigilancia: " + str(exc))
                      time.sleep(min(8, 2 ** attempt))
              raise RuntimeError(str(last_error))

          def github_json(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": "Bearer " + gh_token,
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=15) as response:
                  return json.loads(response.read().decode("utf-8"))

          changed = False

          # Aviso inmediato solo si la ejecución del workflow principal ha fallado.
          if event_name == "workflow_run" and (os.environ.get("FAILED_RUN_CONCLUSION") or "") == "failure":
              run_id = (os.environ.get("FAILED_RUN_ID") or "").strip()
              if run_id and run_id != str(state.get("lastFailureRunId", "")):
                  run_url = os.environ.get("FAILED_RUN_URL", "")
                  telegram_send(
                      "🚨 ERROR EN LA ACTUALIZACIÓN AUTOMÁTICA DEL SAE BIZKAIBUS\n"
                      "La ejecución de GitHub Actions ha terminado con error.\n"
                      "Ejecución: " + run_id + "\n"
                      + (run_url + "\n" if run_url else "")
                      + "El sistema intentará continuar en el siguiente ciclo; revisa el historial si el problema persiste."
                  )
                  state["lastFailureRunId"] = run_id
                  changed = True
                  print("Aviso de fallo enviado para la ejecución " + run_id + ".")

          # Comprueba que el proceso funciona y que la hora REAL de posición no está obsoleta.
          api_url = "https://api.github.com/repos/" + repo + "/actions/workflows/update-siri.yml/runs?branch=main&status=success&per_page=1"
          result = github_json(api_url)
          runs = result.get("workflow_runs", [])
          now = datetime.now(timezone.utc)
          age_minutes = None
          if runs:
              run_stamp = datetime.fromisoformat(runs[0]["updated_at"].replace("Z", "+00:00"))
              age_minutes = (now - run_stamp).total_seconds() / 60

          vehicle_count = 0
          latest_position_stamp = None
          try:
              with open("vehicles.json", encoding="utf-8") as f:
                  snapshot = json.load(f)
              vehicles = snapshot.get("vehicles", [])
              if isinstance(vehicles, list):
                  vehicle_count = len(vehicles)
                  for vehicle in vehicles:
                      raw_time = str(vehicle.get("time") or "").strip()
                      if not raw_time:
                          continue
                      try:
                          position_stamp = datetime.fromisoformat(raw_time.replace("Z", "+00:00"))
                          if position_stamp.tzinfo is None:
                              position_stamp = position_stamp.replace(tzinfo=timezone.utc)
                          if latest_position_stamp is None or position_stamp > latest_position_stamp:
                              latest_position_stamp = position_stamp
                      except ValueError:
                          continue
          except (OSError, json.JSONDecodeError, AttributeError) as exc:
              print("No se pudo leer la hora de posición de vehicles.json: " + str(exc))

          position_age_minutes = None
          if latest_position_stamp is not None:
              position_age_minutes = (now - latest_position_stamp.astimezone(timezone.utc)).total_seconds() / 60

          local_now = now.astimezone(ZoneInfo("Europe/Madrid"))
          # Position timestamps alone are not reliable proof of failure overnight:
          # the fleet may have finished service. The workflow itself is still monitored 24/7.
          position_monitoring_active = local_now.hour >= 5
          workflow_stale = age_minutes is None or age_minutes > 15
          positions_stale = position_monitoring_active and vehicle_count > 0 and (
              position_age_minutes is None or position_age_minutes > 15
          )
          stale = workflow_stale or positions_stale

          if not position_monitoring_active:
              print("Comprobación de antigüedad de posiciones pausada hasta las 05:00 hora peninsular; se mantienen activas las alertas de fallos de GitHub Actions.")

          if stale and not state.get("incidentActive", False):
              reasons = []
              if age_minutes is None:
                  reasons.append("No se encuentra ninguna ejecución correcta reciente de GitHub Actions.")
              elif age_minutes > 15:
                  reasons.append("La última ejecución correcta de GitHub Actions fue hace aproximadamente " + str(round(age_minutes)) + " minutos.")
              if position_monitoring_active and vehicle_count > 0:
                  if position_age_minutes is None:
                      reasons.append("Hay vehículos en el snapshot, pero no se pudo interpretar ninguna hora de posición.")
                  elif position_age_minutes > 15:
                      local_stamp = latest_position_stamp.astimezone(ZoneInfo("Europe/Madrid")).strftime("%d/%m %H:%M:%S")
                      reasons.append(
                          "La última posición comunicada de los autobuses es de las " + local_stamp
                          + " (hace aproximadamente " + str(round(position_age_minutes)) + " minutos, hora peninsular)."
                      )
              age_text = "\n".join(reasons) if reasons else "La vigilancia ha detectado datos que podrían estar desactualizados."
              telegram_send(
                  "⚠️ SAE BIZKAIBUS SIN ACTUALIZACIÓN RECIENTE\n"
                  + age_text + "\n"
                  + "La vigilancia automática ha detectado que el proceso de actualización o los datos de posición podrían estar desactualizados.\n"
                  + "Historial: https://github.com/" + repo + "/actions/workflows/update-siri.yml"
              )
              state["incidentActive"] = True
              state["incidentKind"] = ("both" if workflow_stale and positions_stale else ("workflow" if workflow_stale else "positions"))
              changed = True
              print("Incidencia de falta de actualización notificada.")
          elif not stale and state.get("incidentActive", False):
              # Do not announce a position-feed recovery just because overnight monitoring is paused.
              if not position_monitoring_active and state.get("incidentKind") == "positions":
                  state["incidentActive"] = False
                  state["incidentKind"] = ""
                  changed = True
                  print("Alerta de antigüedad de posiciones cerrada sin falso aviso de recuperación durante horario nocturno.")
              else:
                  telegram_send(
                      "✅ SAE BIZKAIBUS RECUPERADO\n"
                      "La vigilancia ha detectado que la incidencia de actualización ha dejado de cumplirse. "
                      + ("La antigüedad de las posiciones volverá a comprobarse a partir de las 05:00 hora peninsular.\n" if not position_monitoring_active else "Las posiciones disponibles ya están dentro del límite de antigüedad.\n")
                      + "Web: https://enekituss.github.io/sae/"
                  )
                  state["incidentActive"] = False
                  state["incidentKind"] = ""
                  changed = True
                  print("Recuperación notificada.")

          if changed:
              with open(state_path, "w", encoding="utf-8") as f:
                  json.dump(state, f, ensure_ascii=False, indent=2, sort_keys=True)
                  f.write("\n")
              subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
              subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
              subprocess.run(["git", "add", state_path], check=True)
              diff = subprocess.run(["git", "diff", "--cached", "--quiet"], check=False)
              if diff.returncode == 1:
                  subprocess.run(["git", "commit", "-m", "Actualizar estado de vigilancia del SAE"], check=True)
                  subprocess.run(["git", "fetch", "origin", "main"], check=True)
                  subprocess.run(["git", "rebase", "origin/main"], check=True)
                  subprocess.run(["git", "push", "origin", "HEAD:main"], check=True)
                  print("Estado de vigilancia guardado.")
              elif diff.returncode != 0:
                  raise SystemExit("No se pudo comprobar el estado de Git.")
          else:
              print("No se requiere cambiar el estado de vigilancia.")
          PY
