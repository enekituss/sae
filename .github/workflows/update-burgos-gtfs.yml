name: Actualizar horarios de autobús urbano de Burgos

on:
  push:
    paths:
      - "scripts/update_burgos_gtfs.py"
      - "scripts/generate_pwa_icons.py"
      - ".github/workflows/update-burgos-gtfs.yml"
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-gtfs-burgos
  cancel-in-progress: false

jobs:
  refresh-burgos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Generar iconos instalables de la aplicación
        run: python scripts/generate_pwa_icons.py

      - name: Descargar GTFS oficial y generar la base de horarios
        run: python scripts/update_burgos_gtfs.py

      - name: Publicar la base actualizada si hay cambios
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add burgos-data.json icon-192.png icon-512.png
          if git diff --cached --quiet; then
            echo "El archivo generado no ha cambiado; no hay nada que publicar."
            exit 0
          fi
          git commit -m "Actualizar horarios GTFS de Burgos"
          git push
