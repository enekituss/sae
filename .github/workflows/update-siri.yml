name: Actualizar posiciones Bizkaibus

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-siri.yml"

permissions:
  contents: write

concurrency:
  group: actualizar-feed-bizkaibus
  cancel-in-progress: false

jobs:
  refresh-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Cache GTFS oficial de producción
        uses: actions/cache@v4
        with:
          path: /tmp/bizkaibus-gtfs/Bizkaibus.zip
          key: bizkaibus-gtfs-production-2026-10-v2

      - name: Preparar lector GTFS-Realtime
        run: python -m pip install --quiet --disable-pip-version-check gtfs-realtime-bindings
        continue-on-error: true

      - name: Descargar SIRI y enriquecer paradas, destinos y horarios
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import io
          import hashlib
          import json
          import os
          import re
          import urllib.request
          import xml.etree.ElementTree as ET
          import zipfile
          from datetime import datetime, timezone, timedelta
          from zoneinfo import ZoneInfo

          POSITIONS_URL = "https://ctb-siri.s3.eu-south-2.amazonaws.com/bizkaibus-vehicle-positions.xml"
          TRIP_UPDATES_URL = "https://ctb-siri.s3.eu-south-2.amazonaws.com/bizkaibus-trip-updates.xml"
          GTFS_RT_UPDATES_URL = "https://baliabideak.bizkaia.eus/Bizkaibus/GTFSRealTime/FeedTripUpdates.pb"
          PARADAS_API_URL = "https://apps.bizkaia.eus/BBOA000M/rest/BBOA/GetParadas"
          GTFS_BASE = "https://baliabideak.bizkaia.eus/Bizkaibus/GTFS/"
          GTFS_ZIP_URL = GTFS_BASE + "Bizkaibus.zip"
          GTFS_CACHE_FILE = "/tmp/bizkaibus-gtfs/Bizkaibus.zip"
          STATIC_CACHE_VERSION = "production-gtfs-2026-10-v2"
          LOCAL_TZ = ZoneInfo("Europe/Madrid")
          NOW = datetime.now(timezone.utc)
          LOCAL_NOW = datetime.now(LOCAL_TZ)
          gtfs_zip_bytes = None

          def fetch_bytes(url, timeout=15):
              req = urllib.request.Request(url, headers={
                  "User-Agent": "Bizkaibus-Spotter/1.0 (+https://github.com/enekituss/sae)",
                  "Accept": "application/xml, text/xml, text/csv, */*",
              })
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  return response.read()

          def ensure_gtfs_zip():
              global gtfs_zip_bytes
              if gtfs_zip_bytes is not None:
                  return gtfs_zip_bytes
              if os.path.isfile(GTFS_CACHE_FILE):
                  with open(GTFS_CACHE_FILE, "rb") as handle:
                      gtfs_zip_bytes = handle.read()
                  print("Usando ZIP GTFS de caché (" + str(len(gtfs_zip_bytes)) + " bytes).")
              else:
                  print("Descargando GTFS oficial de producción: " + GTFS_ZIP_URL)
                  gtfs_zip_bytes = fetch_bytes(GTFS_ZIP_URL, timeout=60)
                  os.makedirs(os.path.dirname(GTFS_CACHE_FILE), exist_ok=True)
                  with open(GTFS_CACHE_FILE, "wb") as handle:
                      handle.write(gtfs_zip_bytes)
                  print("ZIP GTFS descargado (" + str(len(gtfs_zip_bytes)) + " bytes).")
              return gtfs_zip_bytes

          def gtfs_file(filename):
              archive_data = ensure_gtfs_zip()
              with zipfile.ZipFile(io.BytesIO(archive_data)) as archive:
                  candidates = [n for n in archive.namelist() if n.rsplit("/", 1)[-1].lower() == filename.lower()]
                  if not candidates:
                      raise RuntimeError("El ZIP GTFS no contiene " + filename)
                  return archive.read(candidates[0])

          def gtfs_rows(filename):
              archive_data = ensure_gtfs_zip()
              with zipfile.ZipFile(io.BytesIO(archive_data)) as archive:
                  candidates = [n for n in archive.namelist() if n.rsplit("/", 1)[-1].lower() == filename.lower()]
                  if not candidates:
                      raise RuntimeError("El ZIP GTFS no contiene " + filename)
                  with archive.open(candidates[0], "r") as binary:
                      with io.TextIOWrapper(binary, encoding="utf-8-sig", newline="") as stream:
                          reader = csv.DictReader(stream)
                          for row in reader:
                              yield row

          def local(tag):
              return tag.rsplit("}", 1)[-1]

          def norm_tag(tag):
              return re.sub(r"[^a-z0-9]", "", local(tag).lower())

          def children_text(element):
              result = {}
              for child in list(element):
                  val = (child.text or "").strip()
                  if val:
                      result[norm_tag(child.tag)] = val
              return result

          def descendant_values(element):
              result = {}
              for child in element.iter():
                  val = (child.text or "").strip()
                  if val and norm_tag(child.tag) not in result:
                      result[norm_tag(child.tag)] = val
              return result

          def pick(values, names):
              for name in names:
                  val = values.get(re.sub(r"[^a-z0-9]", "", name.lower()), "")
                  if val:
                      return val
              return ""

          def value(element, *names):
              if element is None:
                  return ""
              vals = descendant_values(element)
              return pick(vals, list(names))

          def parse_time(value):
              if not value:
                  return None
              try:
                  dt = datetime.fromisoformat(value.replace("Z", "+00:00"))
                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=timezone.utc)
                  return dt
              except (ValueError, TypeError):
                  return None

          def is_fresh(path, age_days):
              if not os.path.exists(path):
                  return False
              try:
                  with open(path, encoding="utf-8") as handle:
                      obj = json.load(handle)
                  stamp = parse_time(obj.get("fetchedAt"))
                  return stamp is not None and (NOW - stamp).total_seconds() < age_days * 86400
              except Exception:
                  return False

          # Read the previous published snapshot before overwriting it. Only compare
          # consecutive-ish snapshots; suppress alerts after an extended feed outage.
          previous_vehicles = {}
          previous_snapshot_fresh = False
          try:
              with open("vehicles.json", encoding="utf-8") as handle:
                  previous_snapshot = json.load(handle)
              previous_stamp = parse_time(previous_snapshot.get("fetchedAt"))
              if previous_stamp:
                  previous_age_seconds = (NOW - previous_stamp).total_seconds()
                  previous_snapshot_fresh = -120 <= previous_age_seconds <= 20 * 60
              if previous_snapshot_fresh:
                  for previous_vehicle in previous_snapshot.get("vehicles", []):
                      previous_id = str(previous_vehicle.get("id") or "").strip()
                      if previous_id:
                          previous_vehicles[previous_id] = previous_vehicle
                  print("Snapshot anterior válido para detección de cambios: " + str(len(previous_vehicles)) + " vehículos.")
              else:
                  print("Snapshot anterior ausente o antiguo; esta ejecución solo establecerá la nueva referencia.")
          except Exception as exc:
              print("No hay snapshot anterior legible; no se enviarán alertas iniciales: " + str(exc))

          # Stops: keep a cache so we do not download static data on every 5-min poll.
          # Prefer Bizkaia's official stop-list endpoint, with the public GTFS file as fallback.
          stops_doc = {}
          stops_source = ""
          if os.path.exists("stops.json"):
              try:
                  with open("stops.json", encoding="utf-8") as handle:
                      stops_doc = json.load(handle)
              except Exception:
                  stops_doc = {}

          stops = {}
          stops_refreshed = False
          if is_fresh("stops.json", 7) and stops_doc.get("cacheVersion") == STATIC_CACHE_VERSION and isinstance(stops_doc.get("stops"), list):
              stops = {str(s.get("id", "")): s for s in stops_doc["stops"] if s.get("id")}
              stops_source = stops_doc.get("source", "cache local")
              print("Usando caché de paradas: " + str(len(stops)))
          else:
              id_names = [
                  "stop_id", "StopPointRef", "CodigoParada", "IdParada", "ParadaId",
                  "CodigoPuntoParada", "StopId", "StopCode", "Codigo", "Id"
              ]
              name_names = [
                  "stop_name", "NombreParada", "DenominacionParada", "DescripcionParada",
                  "Nombre", "Denominacion", "Descripcion", "DParada", "Parada"
              ]
              lat_names = ["stop_lat", "Latitud", "Latitude", "Lat", "Y"]
              lon_names = ["stop_lon", "Longitud", "Longitude", "Lon", "X"]

              # Current production GTFS ZIP is newer and easier to parse reliably.
              try:
                  raw = gtfs_file("stops.txt")
                  reader = csv.DictReader(io.StringIO(raw.decode("utf-8-sig")))
                  for row in reader:
                      sid = (row.get("stop_id") or "").strip()
                      name = (row.get("stop_name") or "").strip()
                      if not sid or not name:
                          continue
                      stops[sid] = {
                          "id": sid,
                          "name": name,
                          "lat": (row.get("stop_lat") or "").strip(),
                          "lon": (row.get("stop_lon") or "").strip(),
                          "municipality": (row.get("municipality") or row.get("parent_station") or "").strip(),
                      }
                  if len(stops) >= 50:
                      stops_source = GTFS_ZIP_URL + " (stops.txt)"
                      stops_refreshed = True
                      print("Paradas recuperadas del GTFS oficial: " + str(len(stops)))
                  else:
                      stops = {}
                      print("El archivo stops.txt del GTFS no contiene un listado reconocible.")
              except Exception as exc:
                  stops = {}
                  print("No se pudo leer stops.txt del GTFS oficial: " + str(exc))

              # Last fallback: Bizkaia's official XML API.
              if not stops:
                  id_names = ["stop_id", "StopPointRef", "CodigoParada", "IdParada", "ParadaId", "CodigoPuntoParada", "StopId", "StopCode", "Codigo", "Id"]
                  name_names = ["stop_name", "NombreParada", "DenominacionParada", "DescripcionParada", "Nombre", "Denominacion", "Descripcion", "DParada", "Parada"]
                  lat_names = ["stop_lat", "Latitud", "Latitude", "Lat", "Y"]
                  lon_names = ["stop_lon", "Longitud", "Longitude", "Lon", "X"]
                  try:
                      raw = fetch_bytes(PARADAS_API_URL, timeout=12)
                      root = ET.fromstring(raw)
                      found = {}
                      for element in root.iter():
                          direct = children_text(element)
                          sid = pick(direct, id_names)
                          name = pick(direct, name_names)
                          vals = direct if sid and name else descendant_values(element)
                          sid = sid or pick(vals, id_names)
                          name = name or pick(vals, name_names)
                          if not sid or not name:
                              continue
                          sid = sid.strip()
                          found[sid] = {
                              "id": sid,
                              "name": name.strip(),
                              "lat": pick(vals, lat_names),
                              "lon": pick(vals, lon_names),
                              "municipality": pick(vals, ["Municipio", "Municipality", "NombreMunicipio"]),
                          }
                      if len(found) >= 50:
                          stops = found
                          stops_source = PARADAS_API_URL
                          stops_refreshed = True
                          print("Paradas recuperadas del API oficial: " + str(len(stops)))
                  except Exception as exc:
                      print("No se pudo leer GetParadas: " + str(exc))

          # Create aliases for common StopPointRef formats (for example "4157" and "stop:4157").
          stop_index = {}
          aliases_ambiguous = set()
          def add_stop_alias(alias, item):
              if not alias:
                  return
              if alias in stop_index and stop_index[alias].get("id") != item.get("id"):
                  aliases_ambiguous.add(alias)
              else:
                  stop_index[alias] = item

          for sid, item in stops.items():
              add_stop_alias(str(sid).strip().lower(), item)
              numeric = re.fullmatch(r"0*(\d+)", str(sid).strip())
              if numeric:
                  add_stop_alias(numeric.group(1), item)
              else:
                  suffix = re.search(r"(\d+)$", str(sid).strip())
                  if suffix:
                      add_stop_alias(suffix.group(1), item)
          for alias in aliases_ambiguous:
              stop_index.pop(alias, None)

          # Destinations: SIRI trip-updates first, then the GTFS trip_headsign as fallback.
          trip_updates = {}
          try:
              raw = fetch_bytes(TRIP_UPDATES_URL, timeout=18)
              trip_root = ET.fromstring(raw)
              for element in trip_root.iter():
                  if local(element.tag) not in ("EstimatedVehicleJourney", "MonitoredVehicleJourney", "VehicleJourney", "TripUpdate"):
                      continue
                  jref = value(element, "VehicleJourneyRef", "DatedVehicleJourneyRef")
                  if not jref:
                      continue
                  dest_name = value(element, "DestinationName", "DestinationDisplay", "DestinationText", "JourneyEndName")
                  dest_ref = value(element, "DestinationRef")
                  direction = value(element, "DirectionName")
                  if dest_name or dest_ref or direction:
                      current = trip_updates.get(jref, {})
                      current["destination"] = current.get("destination") or dest_name
                      current["destinationRef"] = current.get("destinationRef") or dest_ref
                      current["direction"] = current.get("direction") or direction
                      trip_updates[jref] = current
              print("Referencias de viaje con datos de destino en SIRI-trip-updates: " + str(len(trip_updates)))
          except Exception as exc:
              print("No se pudo leer trip-updates SIRI; se usará el GTFS cuando sea posible: " + str(exc))

          gtfs_doc = {}
          if os.path.exists("gtfs-trips.json"):
              try:
                  with open("gtfs-trips.json", encoding="utf-8") as handle:
                      gtfs_doc = json.load(handle)
              except Exception:
                  gtfs_doc = {}

          trips = {}
          if is_fresh("gtfs-trips.json", 14) and gtfs_doc.get("cacheVersion") == STATIC_CACHE_VERSION and isinstance(gtfs_doc.get("trips"), dict):
              trips = gtfs_doc["trips"]
              print("Usando caché GTFS de destinos: " + str(len(trips)))
          else:
              try:
                  raw = gtfs_file("trips.txt")
                  reader = csv.DictReader(io.StringIO(raw.decode("utf-8-sig")))
                  for row in reader:
                      tid = (row.get("trip_id") or "").strip()
                      headsign = (row.get("trip_headsign") or "").strip()
                      if not tid:
                          continue
                      item = {
                          "trip_id": tid,
                          "headsign": headsign,
                          "route_id": (row.get("route_id") or "").strip(),
                          "direction_id": (row.get("direction_id") or "").strip(),
                          "service_id": (row.get("service_id") or "").strip(),
                          "trip_short_name": (row.get("trip_short_name") or "").strip(),
                          "block_id": (row.get("block_id") or "").strip(),
                      }
                      trips[tid] = item
                      if tid.startswith("trp_"):
                          trips.setdefault(tid[4:], item)
                      else:
                          trips.setdefault("trp_" + tid, item)
                  if trips:
                      with open("gtfs-trips.json", "w", encoding="utf-8") as handle:
                          json.dump({
                              "fetchedAt": NOW.isoformat(timespec="seconds"),
                              "cacheVersion": STATIC_CACHE_VERSION,
                              "source": GTFS_ZIP_URL + " (trips.txt)",
                              "trips": trips,
                          }, handle, ensure_ascii=False, separators=(",", ":"))
                      print("Destinos GTFS recuperados: " + str(len(trips)))
              except Exception as exc:
                  print("No se pudo leer trips.txt: " + str(exc))
                  if isinstance(gtfs_doc.get("trips"), dict):
                      trips = gtfs_doc["trips"]

          # Read current vehicle positions.
          root = ET.fromstring(fetch_bytes(POSITIONS_URL, timeout=25))
          activities = [e for e in root.iter() if local(e.tag) == "VehicleActivity"]
          if not activities and not any(local(e.tag) == "VehicleMonitoringDelivery" for e in root.iter()):
              raise RuntimeError("La URL respondió, pero no contiene una respuesta SIRI de posiciones.")

          # Parse the official public GTFS-Realtime Trip Updates feed.
          # This is the source for live ETAs; static GTFS stop_times remains a fallback.
          realtime_updates = {}
          realtime_trip_count = 0
          realtime_stop_update_count = 0
          realtime_feed_timestamp = None
          try:
              from google.transit import gtfs_realtime_pb2
              rt_bytes = fetch_bytes(GTFS_RT_UPDATES_URL, timeout=20)
              rt_feed = gtfs_realtime_pb2.FeedMessage()
              rt_feed.ParseFromString(rt_bytes)
              if rt_feed.header.timestamp:
                  realtime_feed_timestamp = datetime.fromtimestamp(rt_feed.header.timestamp, timezone.utc)
              for entity in rt_feed.entity:
                  if not entity.HasField("trip_update"):
                      continue
                  trip_update = entity.trip_update
                  trip_id = trip_update.trip.trip_id if trip_update.HasField("trip") else ""
                  if not trip_id:
                      continue
                  entry_timestamp = int(trip_update.timestamp) if trip_update.timestamp else (
                      int(realtime_feed_timestamp.timestamp()) if realtime_feed_timestamp else 0
                  )
                  stop_updates = []
                  for stop_update in trip_update.stop_time_update:
                      row_update = {
                          "stopSequence": int(stop_update.stop_sequence) if stop_update.stop_sequence else None,
                          "stopId": (stop_update.stop_id or "").strip(),
                          "relationship": int(stop_update.schedule_relationship),
                      }
                      if stop_update.HasField("arrival"):
                          event = stop_update.arrival
                          if event.time:
                              row_update["arrivalEpoch"] = int(event.time)
                          if event.HasField("delay"):
                              row_update["arrivalDelay"] = int(event.delay)
                      if stop_update.HasField("departure"):
                          event = stop_update.departure
                          if event.time:
                              row_update["departureEpoch"] = int(event.time)
                          if event.HasField("delay"):
                              row_update["departureDelay"] = int(event.delay)
                      if len(row_update) > 3:
                          stop_updates.append(row_update)
                  entry = {
                      "tripId": trip_id,
                      "vehicleId": (trip_update.vehicle.id or "").strip() if trip_update.HasField("vehicle") else "",
                      "timestamp": entry_timestamp,
                      "stops": stop_updates,
                  }
                  realtime_updates[trip_id] = entry
                  if trip_id.startswith("trp_"):
                      realtime_updates.setdefault(trip_id[4:], entry)
                  else:
                      realtime_updates.setdefault("trp_" + trip_id, entry)
                  realtime_trip_count += 1
                  realtime_stop_update_count += len(stop_updates)
              print("GTFS-RT TripUpdates: " + str(realtime_trip_count) + " viajes; " + str(realtime_stop_update_count) + " actualizaciones de parada.")
          except Exception as exc:
              print("No se pudo leer el feed GTFS-RT de actualizaciones; se usará el horario estático: " + str(exc))

          # Find each currently active trip's GTFS ID, then scan stop_times.txt once,
          # retaining only those trips. The ZIP is cached by GitHub Actions between runs.
          active_gtfs_trip_ids = set()
          trip_id_by_ref = {}
          service_date_by_trip = {}
          for activity in activities:
              journeys = [e for e in activity.iter() if local(e.tag) == "MonitoredVehicleJourney"]
              if not journeys:
                  continue
              journey = journeys[0]
              ref = value(journey, "VehicleJourneyRef", "DatedVehicleJourneyRef") or value(activity, "VehicleJourneyRef", "DatedVehicleJourneyRef")
              if not ref:
                  continue
              trip_meta = trips.get(ref, {}) or trips.get(ref[4:] if ref.startswith("trp_") else "trp_" + ref, {})
              trip_id = trip_meta.get("trip_id") or ref
              trip_id_by_ref[ref] = trip_id
              active_gtfs_trip_ids.add(trip_id)
              active_gtfs_trip_ids.add(ref)
              if ref.startswith("trp_"):
                  active_gtfs_trip_ids.add(ref[4:])
              else:
                  active_gtfs_trip_ids.add("trp_" + ref)
              # SIRI JourneyRefs encode service-day seconds after the OP... token.
              # If the start is >= 24:00, GTFS times belong to the previous service date.
              time_match = re.search(r"_OP[^_]+_(\d{4,6})_", ref.upper())
              service_date = LOCAL_NOW.date()
              if time_match and int(time_match.group(1)) >= 86400:
                  service_date = service_date - timedelta(days=1)
              service_date_by_trip[trip_id] = service_date
              service_date_by_trip[ref] = service_date

          def gtfs_datetime(raw_time, service_date):
              if not raw_time:
                  return None
              try:
                  hours, minutes, seconds = [int(part) for part in raw_time.strip().split(":")]
                  midnight = datetime.combine(service_date, datetime.min.time(), tzinfo=LOCAL_TZ)
                  return midnight + timedelta(hours=hours, minutes=minutes, seconds=seconds)
              except (ValueError, TypeError):
                  return None

          schedule_by_trip = {}
          if active_gtfs_trip_ids:
              try:
                  for row in gtfs_rows("stop_times.txt"):
                      trip_id = (row.get("trip_id") or "").strip()
                      if trip_id not in active_gtfs_trip_ids:
                          continue
                      stop_id = (row.get("stop_id") or "").strip()
                      seq_text = (row.get("stop_sequence") or "").strip()
                      try:
                          sequence = int(seq_text) if seq_text else None
                      except ValueError:
                          sequence = None
                      stop_obj = stops.get(stop_id) or stop_index.get(stop_id.lower())
                      if not stop_obj:
                          numeric = re.fullmatch(r"0*(\d+)", stop_id)
                          if numeric:
                              stop_obj = stop_index.get(numeric.group(1))
                      service_date = service_date_by_trip.get(trip_id, LOCAL_NOW.date())
                      arrival_dt = gtfs_datetime((row.get("arrival_time") or "").strip(), service_date)
                      departure_dt = gtfs_datetime((row.get("departure_time") or "").strip(), service_date)
                      schedule_by_trip.setdefault(trip_id, []).append({
                          "stopId": stop_id,
                          "stopSequence": sequence,
                          "name": (stop_obj or {}).get("name", "") or stop_id,
                          "arrivalDt": arrival_dt,
                          "departureDt": departure_dt,
                      })
                  for rows in schedule_by_trip.values():
                      rows.sort(key=lambda x: (x["stopSequence"] is None, x["stopSequence"] or 0))
                  print("Horarios estáticos cargados para " + str(len(schedule_by_trip)) + " viajes activos.")
              except Exception as exc:
                  print("No se pudo leer stop_times.txt: " + str(exc))

          def realtime_entry_for(trip_id, ref, vehicle_id):
              for key in (trip_id, ref, trip_id[4:] if trip_id.startswith("trp_") else "trp_" + trip_id):
                  if key and key in realtime_updates:
                      return realtime_updates[key]
              if vehicle_id:
                  seen_entries = set()
                  for entry in realtime_updates.values():
                      marker = entry.get("tripId")
                      if marker in seen_entries:
                          continue
                      seen_entries.add(marker)
                      if entry.get("vehicleId") == vehicle_id:
                          return entry
              return None

          def iso_local(dt):
              return dt.isoformat(timespec="seconds") if dt else ""

          def compose_upcoming_stops(ref, trip_id, current_stop_id, arrival_status, vehicle_id):
              rows = schedule_by_trip.get(trip_id) or schedule_by_trip.get(ref) or []
              if not rows:
                  return [], 0
              now_local = datetime.now(LOCAL_TZ)
              current_stop_key = (current_stop_id or "").strip().lower()
              matches = [i for i, row in enumerate(rows) if current_stop_key and row["stopId"].strip().lower() == current_stop_key]
              start_index = 0
              if matches:
                  def time_distance(index):
                      dt = rows[index]["arrivalDt"] or rows[index]["departureDt"]
                      return abs((dt - now_local).total_seconds()) if dt else 10**12
                  current_index = min(matches, key=time_distance)
                  status = (arrival_status or "").lower()
                  start_index = current_index + 1 if status in ("arrived", "departed", "passed", "left") else current_index
              else:
                  future = [
                      i for i, row in enumerate(rows)
                      if (row["arrivalDt"] or row["departureDt"]) and (row["arrivalDt"] or row["departureDt"]) >= now_local - timedelta(minutes=3)
                  ]
                  start_index = future[0] if future else len(rows)

              rt_entry = realtime_entry_for(trip_id, ref, vehicle_id)
              rt_is_fresh = False
              if rt_entry and rt_entry.get("timestamp"):
                  rt_age = now_local.timestamp() - rt_entry["timestamp"]
                  rt_is_fresh = -120 <= rt_age <= 15 * 60
              rt_stops = rt_entry.get("stops", []) if rt_entry and rt_is_fresh else []
              output = []
              realtime_used = 0
              for row in rows[start_index:]:
                  rt_match = None
                  for candidate in rt_stops:
                      seq_match = row["stopSequence"] is not None and candidate.get("stopSequence") == row["stopSequence"]
                      stop_match = bool(row["stopId"] and candidate.get("stopId") and row["stopId"].strip().lower() == candidate["stopId"].strip().lower())
                      if seq_match or (row["stopSequence"] is None and stop_match) or (seq_match and stop_match):
                          rt_match = candidate
                          break
                  schedule_arrival = row["arrivalDt"]
                  schedule_departure = row["departureDt"]
                  arrival_dt = schedule_arrival
                  departure_dt = schedule_departure
                  source = "Horario GTFS"
                  status = ""

                  if rt_match and rt_match.get("relationship") == 1:
                      status = "Omitida según GTFS-RT"
                  elif rt_match:
                      rt_arrival = None
                      rt_departure = None
                      if rt_match.get("arrivalEpoch"):
                          rt_arrival = datetime.fromtimestamp(rt_match["arrivalEpoch"], timezone.utc).astimezone(LOCAL_TZ)
                      elif "arrivalDelay" in rt_match and schedule_arrival:
                          rt_arrival = schedule_arrival + timedelta(seconds=rt_match["arrivalDelay"])
                      if rt_match.get("departureEpoch"):
                          rt_departure = datetime.fromtimestamp(rt_match["departureEpoch"], timezone.utc).astimezone(LOCAL_TZ)
                      elif "departureDelay" in rt_match and schedule_departure:
                          rt_departure = schedule_departure + timedelta(seconds=rt_match["departureDelay"])
                      if rt_arrival or rt_departure:
                          arrival_dt = rt_arrival or arrival_dt
                          departure_dt = rt_departure or departure_dt
                          source = "Estimación GTFS-RT"
                          realtime_used += 1

                  event_dt = arrival_dt or departure_dt
                  if not event_dt:
                      source = "Horario GTFS · hora no disponible"
                  elif source == "Horario GTFS" and event_dt < now_local - timedelta(minutes=1):
                      source = "Horario GTFS · hora pasada"
                  output.append({
                      "stopId": row["stopId"],
                      "stopSequence": row["stopSequence"],
                      "name": row["name"] or row["stopId"] or "Parada sin nombre",
                      "arrivalTime": iso_local(arrival_dt),
                      "departureTime": iso_local(departure_dt),
                      "timeSource": source,
                      "status": status,
                  })
              return output, realtime_used

          def extract_service_number(ref):
              # Many live VehicleJourneyRefs end with a route-specific code such as
              # O9SI3411_341102_12. The six-digit code repeats the four-digit route
              # code and adds a two-digit service number (02 -> Servicio 2).
              parts = (ref or "").split("_")
              for index in range(len(parts) - 1):
                  previous = parts[index]
                  route_match = re.search(r"(\d{4})$", previous) if previous.startswith("O") else None
                  candidate = parts[index + 1]
                  if route_match and re.fullmatch(r"\d{6}", candidate) and candidate.startswith(route_match.group(1)):
                      return str(int(candidate[-2:])), candidate
              return "", ""

          vehicles = []
          seen = set()
          joined_stops = 0
          joined_destinations = 0
          for index, activity in enumerate(activities, 1):
              journeys = [e for e in activity.iter() if local(e.tag) == "MonitoredVehicleJourney"]
              if not journeys:
                  continue
              journey = journeys[0]

              vehicle_id = value(journey, "VehicleRef", "VehicleIdentifier", "VehicleId", "FleetNumber")
              jref = value(journey, "VehicleJourneyRef", "DatedVehicleJourneyRef")
              if not jref:
                  jref = value(activity, "VehicleJourneyRef", "DatedVehicleJourneyRef")

              line_name = value(journey, "PublishedLineName", "LineName", "PublicLineCode", "LinePublicNumber")
              line_ref = value(journey, "LineRef", "LineReference")
              line = line_name or line_ref
              if not line and jref:
                  match = re.search(r"(?:^|_)([A-Z]\d{3,4})(?:_|$)", jref.upper())
                  if match:
                      line = match.group(1)
              if not line:
                  line = "Sin línea identificada"

              stop_id = value(journey, "StopPointRef", "StopPointId")
              stop_name = value(journey, "StopPointName")
              stop_item = stop_index.get(stop_id.lower()) if stop_id else None
              if not stop_item and stop_id:
                  numeric = re.fullmatch(r"0*(\d+)", stop_id.strip())
                  stop_item = stop_index.get(numeric.group(1)) if numeric else None
              if stop_item:
                  stop_name = stop_name or stop_item.get("name", "")
                  joined_stops += 1

              update = trip_updates.get(jref, {})
              gtfs = trips.get(jref, {}) or trips.get(jref[4:] if jref.startswith("trp_") else "trp_" + jref, {})
              gtfs_trip_id = gtfs.get("trip_id") or trip_id_by_ref.get(jref) or jref
              destination = value(journey, "DestinationName", "DestinationDisplay", "DestinationText", "JourneyEndName")
              destination_ref = value(journey, "DestinationRef")
              direction = value(journey, "DirectionName")
              destination_source = "SIRI" if destination else ""

              if not destination and update.get("destination"):
                  destination = update.get("destination", "")
                  destination_source = "Actualizaciones SIRI"
              if not destination and gtfs.get("headsign"):
                  destination = gtfs.get("headsign", "")
                  destination_source = "GTFS · horario"
              if not destination and direction:
                  destination = direction
                  destination_source = "Sentido SIRI"

              destination_ref = destination_ref or update.get("destinationRef", "")
              direction = direction or update.get("direction", "")
              if not destination and destination_ref:
                  dest_stop = stop_index.get(destination_ref.lower())
                  if dest_stop:
                      destination = dest_stop.get("name", "")
                      destination_source = "Directorio de paradas"
              if destination:
                  joined_destinations += 1

              arrival_status = value(journey, "ArrivalStatus") or value(journey, "DepartureStatus")
              upcoming_stops, realtime_stops_used = compose_upcoming_stops(jref, gtfs_trip_id, stop_id, arrival_status, vehicle_id)
              service_number, service_code = extract_service_number(jref)

              item = {
                  "id": vehicle_id or jref or ("Registro " + str(index)),
                  "idType": "ID de vehículo" if vehicle_id else ("Referencia de viaje (sin ID de vehículo)" if jref else "Identificador no publicado"),
                  "line": line,
                  "lineRef": line_ref,
                  "direction": direction,
                  "destination": destination,
                  "destinationSource": destination_source,
                  "destinationRef": destination_ref,
                  "tripId": gtfs_trip_id,
                  "tripShortName": gtfs.get("trip_short_name", ""),
                  "blockId": gtfs.get("block_id", ""),
                  "calendarServiceId": gtfs.get("service_id", ""),
                  "serviceNumber": service_number,
                  "serviceCode": service_code,
                  "upcomingStops": upcoming_stops,
                  "time": value(journey, "LocationRecordedAtTime", "RecordedAtTime") or value(activity, "RecordedAtTime", "ValidUntilTime"),
                  "stop": stop_id,
                  "stopName": stop_name,
                  "stopLat": (stop_item or {}).get("lat", ""),
                  "stopLon": (stop_item or {}).get("lon", ""),
                  "stopSource": stops_source if stop_item else "",
                  "journeyRef": jref,
                  "lat": value(journey, "Latitude"),
                  "lon": value(journey, "Longitude"),
              }
              key = (item["id"], item["line"], item["journeyRef"])
              if key not in seen:
                  seen.add(key)
                  vehicles.append(item)

          snapshot = {
              "sourceUrl": POSITIONS_URL,
              "tripUpdatesUrl": GTFS_RT_UPDATES_URL,
              "fetchedAt": NOW.isoformat(timespec="seconds"),
              "vehicleCount": len(vehicles),
              "stopLookupCount": len(stops),
              "stopMatches": joined_stops,
              "destinationMatches": joined_destinations,
              "vehicleBlocks": sum(1 for v in vehicles if v.get("blockId")),
              "tripShortNames": sum(1 for v in vehicles if v.get("tripShortName")),
              "vehiclesWithServiceNumber": sum(1 for v in vehicles if v.get("serviceNumber")),
              "vehiclesWithUpcomingStops": sum(1 for v in vehicles if v.get("upcomingStops")),
              "vehiclesWithRealtimeStopTimes": sum(1 for v in vehicles if any(s.get("timeSource") == "Estimación GTFS-RT" for s in v.get("upcomingStops", []))),
              "vehicles": vehicles,
          }

          # Detect route changes and departures from the active SIRI feed.
          # Telegram alerts are kept in a durable outbox until a successful send is acknowledged.
          def normalized_route_value(value):
              return re.sub(r"\s+", " ", str(value or "").strip()).casefold()

          def stable_event_id(prefix, payload):
              serialized = json.dumps(payload, ensure_ascii=False, sort_keys=True, separators=(",", ":"))
              return prefix + ":" + hashlib.sha256(serialized.encode("utf-8")).hexdigest()[:24]

          STATE_PATH = "vehicle-alert-state.json"
          alert_state = {"schemaVersion": 1, "pendingVehicles": {}, "outbox": {}}
          if os.path.isfile(STATE_PATH):
              try:
                  with open(STATE_PATH, encoding="utf-8") as handle:
                      loaded_state = json.load(handle)
                  if isinstance(loaded_state, dict):
                      alert_state.update(loaded_state)
              except Exception as exc:
                  print("No se pudo leer el estado de alertas; se inicializará de nuevo: " + str(exc))
          if not isinstance(alert_state.get("pendingVehicles"), dict):
              alert_state["pendingVehicles"] = {}
          if not isinstance(alert_state.get("outbox"), dict):
              alert_state["outbox"] = {}
          if not isinstance(alert_state.get("pendingArrivals"), dict):
              alert_state["pendingArrivals"] = {}
          if not isinstance(alert_state.get("lastNonEmptyVehicles"), dict):
              alert_state["lastNonEmptyVehicles"] = {}
          if not isinstance(alert_state.get("emptyFeedState"), dict):
              alert_state["emptyFeedState"] = {"consecutiveChecks": 0, "firstObservedAt": ""}

          pending_vehicles = alert_state["pendingVehicles"]
          pending_arrivals = alert_state["pendingArrivals"]
          outbox = alert_state["outbox"]
          last_non_empty_vehicles = alert_state["lastNonEmptyVehicles"]
          empty_feed_state = alert_state["emptyFeedState"]
          empty_feed_state.setdefault("consecutiveChecks", 0)
          empty_feed_state.setdefault("firstObservedAt", "")
          previous_by_id = {}
          if previous_snapshot_fresh:
              for previous_id, previous_vehicle in previous_vehicles.items():
                  if previous_vehicle.get("idType") == "ID de vehículo":
                      previous_by_id[previous_id] = previous_vehicle

          current_by_id = {}
          for current_vehicle in vehicles:
              if current_vehicle.get("idType") != "ID de vehículo":
                  continue
              current_id = str(current_vehicle.get("id") or "").strip()
              if not current_id:
                  continue
              score = sum(1 for field in ("line", "destination", "direction", "lineRef") if current_vehicle.get(field))
              previous_choice = current_by_id.get(current_id)
              previous_score = sum(1 for field in ("line", "destination", "direction", "lineRef") if previous_choice and previous_choice.get(field))
              if previous_choice is None or score > previous_score:
                  current_by_id[current_id] = current_vehicle

          def has_recent_position(vehicle):
              observed_at = parse_time(vehicle.get("time"))
              if observed_at is None:
                  return False
              age_seconds = (NOW - observed_at.astimezone(timezone.utc)).total_seconds()
              return -120 <= age_seconds <= 15 * 60

          # Keep a fresh previous view for route comparisons and arrivals, but retain
          # previous_by_id in full for departure tracking when a position timestamp goes stale.
          previous_recent_by_id = {
              vehicle_id: vehicle
              for vehicle_id, vehicle in previous_by_id.items()
              if has_recent_position(vehicle)
          } if previous_snapshot_fresh else {}

          # A record left in SIRI with an old LocationRecordedAtTime is not enough to prove
          # that the vehicle is currently in service. If every identified vehicle is stale,
          # pause per-vehicle entry/exit detection and let the watchdog report the feed outage.
          if current_by_id:
              recent_ids = {
                  vehicle_id for vehicle_id, vehicle in current_by_id.items()
                  if has_recent_position(vehicle)
              }
              if recent_ids:
                  current_by_id = {
                      vehicle_id: vehicle
                      for vehicle_id, vehicle in current_by_id.items()
                      if vehicle_id in recent_ids
                  }
                  # Keep the last active reference only when the previous snapshot had
                  # fresh position timestamps; don't replace it with stale remnants.
                  if previous_recent_by_id:
                      last_non_empty_vehicles = dict(previous_recent_by_id)
              else:
                  current_by_id = {}
                  previous_snapshot_fresh = False
                  previous_recent_by_id = {}
                  print("Las posiciones SIRI de todos los vehículos tienen más de 15 minutos; se pausa la detección individual para evitar falsas salidas.")

          # Confirm newly appearing vehicles across two successful observations. The feed is
          # pull-based, so this is the earliest reliable signal available to this workflow.
          confirmed_entry_count = 0
          if previous_snapshot_fresh:
              for vehicle_id, candidate in list(pending_arrivals.items()):
                  first_observed_dt = parse_time(candidate.get("firstObservedAt"))
                  if first_observed_dt and (NOW - first_observed_dt.astimezone(timezone.utc)).total_seconds() > 60 * 60:
                      pending_arrivals.pop(vehicle_id, None)
                      continue
                  current_vehicle = current_by_id.get(vehicle_id)
                  if current_vehicle is None or vehicle_id in pending_vehicles:
                      pending_arrivals.pop(vehicle_id, None)
                      continue
                  candidate["consecutiveChecks"] = int(candidate.get("consecutiveChecks", 1)) + 1
                  if first_observed_dt is None:
                      candidate["firstObservedAt"] = LOCAL_NOW.isoformat(timespec="seconds")
                      first_observed_dt = LOCAL_NOW
                  elapsed_seconds = (NOW - first_observed_dt.astimezone(timezone.utc)).total_seconds()
                  if candidate["consecutiveChecks"] < 2 or elapsed_seconds < 2 * 60:
                      continue
                  event_payload = {
                      "vehicleId": vehicle_id,
                      "firstObservedAt": candidate.get("firstObservedAt", ""),
                  }
                  event_id = stable_event_id("entered", event_payload)
                  outbox.setdefault(event_id, {
                      "eventId": event_id,
                      "type": "vehicle_entered",
                      "vehicleId": vehicle_id,
                      "line": str(current_vehicle.get("line") or ""),
                      "destination": str(current_vehicle.get("destination") or ""),
                      "direction": str(current_vehicle.get("direction") or ""),
                      "firstObservedAt": candidate.get("firstObservedAt", ""),
                      "detectedAt": LOCAL_NOW.isoformat(timespec="minutes"),
                      "queuedAt": LOCAL_NOW.isoformat(timespec="seconds"),
                  })
                  pending_arrivals.pop(vehicle_id, None)
                  confirmed_entry_count += 1

              # Start candidates only after a valid previous snapshot exists. This avoids
              # announcing the whole fleet as "new" when the workflow is first installed.
              for current_id, current_vehicle in current_by_id.items():
                  if current_id in previous_recent_by_id or current_id in pending_vehicles or current_id in pending_arrivals:
                      continue
                  pending_arrivals[current_id] = {
                      "vehicleId": current_id,
                      "firstObservedAt": LOCAL_NOW.isoformat(timespec="seconds"),
                      "consecutiveChecks": 1,
                      "line": str(current_vehicle.get("line") or ""),
                      "destination": str(current_vehicle.get("destination") or ""),
                      "direction": str(current_vehicle.get("direction") or ""),
                  }

          # If a missing vehicle returns, compare the last route before clearing its state.
          # This identifies a bus that disappears on one line and then reappears on another.
          for vehicle_id in list(pending_vehicles):
              if vehicle_id not in current_by_id:
                  continue

              candidate = pending_vehicles.pop(vehicle_id)
              queued_id = candidate.get("eventId")
              queued_event = outbox.get(queued_id) if queued_id else None
              if queued_event and queued_event.get("type") == "vehicle_missing":
                  outbox.pop(queued_id, None)

              last_known = candidate.get("lastKnown", {})
              current_vehicle = current_by_id[vehicle_id]
              changed_fields = []
              for field, label in [
                  ("line", "Línea"),
                  ("destination", "Destino"),
                  ("direction", "Sentido"),
              ]:
                  old_value = str(last_known.get(field) or "").strip()
                  new_value = str(current_vehicle.get(field) or "").strip()
                  if old_value and new_value and normalized_route_value(old_value) != normalized_route_value(new_value):
                      changed_fields.append({
                          "field": field,
                          "label": label,
                          "old": old_value,
                          "new": new_value,
                      })

              # Compare routes only across a recent tracking window. If Actions or the feed
              # was unavailable for a long time, a later trip can have a different destination
              # for ordinary timetable reasons, so do not infer a route change from stale data.
              first_missing_dt = parse_time(candidate.get("firstMissingAt"))
              candidate_age_seconds = (
                  (NOW - first_missing_dt.astimezone(timezone.utc)).total_seconds()
                  if first_missing_dt else 999999
              )
              route_comparison_is_recent = previous_snapshot_fresh and candidate_age_seconds <= 15 * 60

              # Replace an undelivered absence notice with the more useful route-change alert.
              if changed_fields and route_comparison_is_recent:
                  event_payload = {
                      "vehicleId": vehicle_id,
                      "firstMissingAt": candidate.get("firstMissingAt", ""),
                      "reappearedAt": snapshot.get("fetchedAt", ""),
                      "changed": changed_fields,
                  }
                  event_id = stable_event_id("route_after_gap", event_payload)
                  outbox.setdefault(event_id, {
                      "eventId": event_id,
                      "type": "route_change_after_gap",
                      "vehicleId": vehicle_id,
                      "line": str(current_vehicle.get("line") or ""),
                      "destination": str(current_vehicle.get("destination") or ""),
                      "direction": str(current_vehicle.get("direction") or ""),
                      "changed": changed_fields,
                      "detectedAt": LOCAL_NOW.isoformat(timespec="minutes"),
                      "queuedAt": LOCAL_NOW.isoformat(timespec="seconds"),
                  })
              elif candidate.get("alerted"):
                  # Close the loop if a previously reported vehicle comes back on the same route.
                  event_payload = {
                      "vehicleId": vehicle_id,
                      "firstMissingAt": candidate.get("firstMissingAt", ""),
                      "reappearedAt": snapshot.get("fetchedAt", ""),
                  }
                  event_id = stable_event_id("vehicle_returned", event_payload)
                  outbox.setdefault(event_id, {
                      "eventId": event_id,
                      "type": "vehicle_returned",
                      "vehicleId": vehicle_id,
                      "line": str(current_vehicle.get("line") or ""),
                      "destination": str(current_vehicle.get("destination") or ""),
                      "direction": str(current_vehicle.get("direction") or ""),
                      "lastKnown": last_known,
                      "detectedAt": LOCAL_NOW.isoformat(timespec="minutes"),
                      "queuedAt": LOCAL_NOW.isoformat(timespec="seconds"),
                  })

          # Retain pending states for a short window only; never discard a queued notification.
          for vehicle_id, candidate in list(pending_vehicles.items()):
              first_missing = parse_time(candidate.get("firstMissingAt"))
              if first_missing and (NOW - first_missing).total_seconds() > 60 * 60 and not candidate.get("notificationQueued"):
                  pending_vehicles.pop(vehicle_id, None)

          pending_route_changes = alert_state.get("pendingRouteChanges", {})
          if not isinstance(pending_route_changes, dict):
              pending_route_changes = {}
          for vehicle_id, candidate in list(pending_route_changes.items()):
              first_observed = parse_time(candidate.get("firstObservedAt"))
              if first_observed and (NOW - first_observed).total_seconds() > 60 * 60:
                  pending_route_changes.pop(vehicle_id, None)

          route_change_count = 0
          confirmed_route_count = 0
          observed_changes = {}
          route_fields = [
              ("line", "Línea"),
              ("destination", "Destino"),
              ("direction", "Sentido"),
          ]
          if previous_snapshot_fresh and current_by_id:
              for current_id, current_vehicle in current_by_id.items():
                  old_vehicle = previous_recent_by_id.get(current_id)
                  if not old_vehicle:
                      continue
                  changed_fields = []
                  for field, label in route_fields:
                      old_value = str(old_vehicle.get(field) or "").strip()
                      new_value = str(current_vehicle.get(field) or "").strip()
                      # Only compare two published, non-empty values.
                      if old_value and new_value and normalized_route_value(old_value) != normalized_route_value(new_value):
                          changed_fields.append({
                              "field": field,
                              "label": label,
                              "old": old_value,
                              "new": new_value,
                          })
                  if changed_fields:
                      observed_changes[current_id] = changed_fields
                      route_change_count += 1

              handled_route_candidates = set()
              for vehicle_id, candidate in list(pending_route_changes.items()):
                  handled_route_candidates.add(vehicle_id)
                  current_vehicle = current_by_id.get(vehicle_id)
                  if current_vehicle is None:
                      pending_route_changes.pop(vehicle_id, None)
                      continue

                  candidate_fields = candidate.get("changed", [])
                  still_matches = bool(candidate_fields)
                  for item in candidate_fields:
                      current_value = str(current_vehicle.get(item.get("field")) or "").strip()
                      target_value = str(item.get("new") or "").strip()
                      if not current_value or not target_value or normalized_route_value(current_value) != normalized_route_value(target_value):
                          still_matches = False
                          break

                  if not still_matches:
                      pending_route_changes.pop(vehicle_id, None)
                      # If it changed again, start a fresh confirmation window for the new value.
                      if observed_changes.get(vehicle_id):
                          pending_route_changes[vehicle_id] = {
                              "vehicleId": vehicle_id,
                              "changed": observed_changes[vehicle_id],
                              "firstObservedAt": LOCAL_NOW.isoformat(timespec="seconds"),
                              "consecutiveChecks": 1,
                          }
                      continue

                  # Merge other fields that changed in the same interval for this vehicle.
                  known_fields = {str(item.get("field")) for item in candidate_fields}
                  for item in observed_changes.get(vehicle_id, []):
                      if str(item.get("field")) not in known_fields:
                          candidate_fields.append(item)
                          known_fields.add(str(item.get("field")))
                  candidate["changed"] = candidate_fields
                  candidate["consecutiveChecks"] = int(candidate.get("consecutiveChecks", 1)) + 1

                  first_observed = parse_time(candidate.get("firstObservedAt"))
                  if first_observed is None:
                      candidate["firstObservedAt"] = LOCAL_NOW.isoformat(timespec="seconds")
                      first_observed = LOCAL_NOW
                  elapsed_seconds = (NOW - first_observed.astimezone(timezone.utc)).total_seconds()
                  if candidate["consecutiveChecks"] < 2 or elapsed_seconds < 2 * 60:
                      continue

                  event_payload = {
                      "vehicleId": vehicle_id,
                      "firstObservedAt": candidate.get("firstObservedAt", ""),
                      "changed": candidate_fields,
                  }
                  event_id = stable_event_id("route", event_payload)
                  if event_id not in outbox:
                      outbox[event_id] = {
                          "eventId": event_id,
                          "type": "route_change",
                          "vehicleId": vehicle_id,
                          "line": str(current_vehicle.get("line") or ""),
                          "destination": str(current_vehicle.get("destination") or ""),
                          "direction": str(current_vehicle.get("direction") or ""),
                          "changed": candidate_fields,
                          "detectedAt": LOCAL_NOW.isoformat(timespec="minutes"),
                          "queuedAt": LOCAL_NOW.isoformat(timespec="seconds"),
                      }
                  pending_route_changes.pop(vehicle_id, None)
                  confirmed_route_count += 1

              # Start one confirmation window per vehicle for newly observed differences.
              for vehicle_id, changed_fields in observed_changes.items():
                  if vehicle_id in handled_route_candidates or vehicle_id in pending_route_changes:
                      continue
                  pending_route_changes[vehicle_id] = {
                      "vehicleId": vehicle_id,
                      "changed": changed_fields,
                      "firstObservedAt": LOCAL_NOW.isoformat(timespec="seconds"),
                      "consecutiveChecks": 1,
                  }

          alert_state["pendingRouteChanges"] = pending_route_changes
          missing_confirmed_count = 0
          current_count = len(current_by_id)
          previous_count = len(previous_by_id)
          if not previous_snapshot_fresh:
              # After a long feed gap, don't infer that every old vehicle has left service.
              for candidate in pending_vehicles.values():
                  candidate["consecutiveMissing"] = 0
              print("Detección de desapariciones pausada: el snapshot anterior no es reciente.")
          elif current_count == 0:
              # An empty live feed can be an outage or the end of the operating day.
              # Seed candidates but do not count empty samples as proof of departure.
              for vehicle_id, candidate in pending_vehicles.items():
                  candidate["consecutiveMissing"] = 0
                  candidate["requiredMissing"] = max(6, int(candidate.get("requiredMissing", 3)))
              for vehicle_id, old_vehicle in previous_by_id.items():
                  if vehicle_id not in pending_vehicles:
                      pending_vehicles[vehicle_id] = {
                          "lastKnown": {
                              "id": vehicle_id,
                              "line": old_vehicle.get("line", ""),
                              "destination": old_vehicle.get("destination", ""),
                              "direction": old_vehicle.get("direction", ""),
                          },
                          "lastSeenAt": str(old_vehicle.get("time") or previous_snapshot.get("fetchedAt") or ""),
                          "firstMissingAt": LOCAL_NOW.isoformat(timespec="seconds"),
                          "consecutiveMissing": 0,
                          "requiredMissing": 6,
                          "notificationQueued": False,
                          "alerted": False,
                      }
              print("Feed sin vehículos activos: no se cuentan estas consultas como confirmación de desaparición.")
          else:
              # A sudden fleet-wide reduction may be a partial feed. Seed candidates but
              # require six consecutive non-empty samples before sending any of those alerts.
              # Once those reinforced candidates exist, do not reset their counters on every
              # poll merely because the same partial subset continues to be published.
              absent_ids = [vehicle_id for vehicle_id in previous_by_id if vehicle_id not in current_by_id]
              reinforced_drop_already_tracking = bool(absent_ids) and all(
                  vehicle_id in pending_vehicles and int(pending_vehicles[vehicle_id].get("requiredMissing", 0)) >= 6
                  for vehicle_id in absent_ids
              )
              large_drop = (
                  previous_count >= 10
                  and current_count < max(5, previous_count * 0.4)
                  and not reinforced_drop_already_tracking
              )
              if large_drop:
                  for candidate in pending_vehicles.values():
                      candidate["consecutiveMissing"] = 0
                      candidate["requiredMissing"] = max(6, int(candidate.get("requiredMissing", 3)))
                  for vehicle_id, old_vehicle in previous_by_id.items():
                      if vehicle_id not in current_by_id and vehicle_id not in pending_vehicles:
                          pending_vehicles[vehicle_id] = {
                              "lastKnown": {
                                  "id": vehicle_id,
                                  "line": old_vehicle.get("line", ""),
                                  "destination": old_vehicle.get("destination", ""),
                                  "direction": old_vehicle.get("direction", ""),
                              },
                              "lastSeenAt": str(old_vehicle.get("time") or previous_snapshot.get("fetchedAt") or ""),
                              "firstMissingAt": LOCAL_NOW.isoformat(timespec="seconds"),
                              "consecutiveMissing": 0,
                              "requiredMissing": 6,
                              "notificationQueued": False,
                              "alerted": False,
                          }
                  print("Reducción brusca del feed (" + str(previous_count) + " → " + str(current_count) +
                        " vehículos): se aplicará una confirmación reforzada antes de avisar.")
              else:
                  # Advance existing absence candidates once for this successful non-empty poll.
                  for vehicle_id, candidate in list(pending_vehicles.items()):
                      if vehicle_id in current_by_id:
                          continue
                      if candidate.get("alerted") or candidate.get("notificationQueued"):
                          continue
                      candidate["consecutiveMissing"] = int(candidate.get("consecutiveMissing", 0)) + 1
                      # Older ordinary candidates used 3 samples; migrate them to 2.
                      if int(candidate.get("requiredMissing", 2)) == 3:
                          candidate["requiredMissing"] = 2
                      candidate.setdefault("requiredMissing", 2)
                      required = max(2, int(candidate.get("requiredMissing", 2)))
                      if candidate["consecutiveMissing"] >= required:
                          first_missing_dt = parse_time(candidate.get("firstMissingAt"))
                          if first_missing_dt is None:
                              candidate["firstMissingAt"] = LOCAL_NOW.isoformat(timespec="seconds")
                              first_missing_dt = LOCAL_NOW
                          minimum_missing_seconds = 20 * 60 if required >= 6 else 3 * 60
                          elapsed_missing_seconds = (NOW - first_missing_dt.astimezone(timezone.utc)).total_seconds()
                          # With the external fast scheduler, this 3-minute minimum is
                          # checked on roughly 2-minute cycles without removing confirmation safeguards.
                          if elapsed_missing_seconds < minimum_missing_seconds:
                              continue
                          last_known = candidate.get("lastKnown", {})
                          event_payload = {
                              "vehicleId": vehicle_id,
                              "firstMissingAt": candidate.get("firstMissingAt", ""),
                          }
                          event_id = stable_event_id("missing", event_payload)
                          event = {
                              "eventId": event_id,
                              "type": "vehicle_missing",
                              "vehicleId": vehicle_id,
                              "line": last_known.get("line", ""),
                              "destination": last_known.get("destination", ""),
                              "direction": last_known.get("direction", ""),
                              "lastSeenAt": candidate.get("lastSeenAt", ""),
                              "firstMissingAt": candidate.get("firstMissingAt", ""),
                              "detectedAt": LOCAL_NOW.isoformat(timespec="minutes"),
                              "missingChecks": candidate["consecutiveMissing"],
                              "queuedAt": LOCAL_NOW.isoformat(timespec="seconds"),
                          }
                          outbox.setdefault(event_id, event)
                          candidate["eventId"] = event_id
                          candidate["notificationQueued"] = True
                          missing_confirmed_count += 1

                  # Start tracking vehicles absent from the previous good snapshot.
                  # Alerts still require repeated valid observations and a minimum elapsed window.
                  for vehicle_id, old_vehicle in previous_by_id.items():
                      if vehicle_id in current_by_id or vehicle_id in pending_vehicles:
                          continue
                      pending_vehicles[vehicle_id] = {
                          "lastKnown": {
                              "id": vehicle_id,
                              "line": old_vehicle.get("line", ""),
                              "destination": old_vehicle.get("destination", ""),
                              "direction": old_vehicle.get("direction", ""),
                          },
                          "lastSeenAt": str(old_vehicle.get("time") or previous_snapshot.get("fetchedAt") or ""),
                          "firstMissingAt": LOCAL_NOW.isoformat(timespec="seconds"),
                          "consecutiveMissing": 1,
                          "requiredMissing": 2,
                          "notificationQueued": False,
                          "alerted": False,
                      }

          # A valid SIRI response with zero vehicles is ambiguous: it can mean the end of
          # service or a temporary upstream publication issue. Confirm it only after four
          # consecutive empty responses spanning at least six minutes.
          if current_count == 0 and previous_snapshot_fresh:
              empty_feed_state["consecutiveChecks"] = int(empty_feed_state.get("consecutiveChecks", 0)) + 1
              if not empty_feed_state.get("firstObservedAt"):
                  empty_feed_state["firstObservedAt"] = LOCAL_NOW.isoformat(timespec="seconds")
              first_empty_dt = parse_time(empty_feed_state.get("firstObservedAt"))
              empty_elapsed_seconds = (
                  (NOW - first_empty_dt.astimezone(timezone.utc)).total_seconds()
                  if first_empty_dt else 0
              )

              # Seed the missing-vehicle candidates from the last non-empty fleet, even if
              # vehicles.json has already been replaced by an empty snapshot.
              for vehicle_id, old_vehicle in list(last_non_empty_vehicles.items()):
                  if vehicle_id in pending_vehicles:
                      continue
                  pending_vehicles[vehicle_id] = {
                      "lastKnown": {
                          "id": vehicle_id,
                          "line": old_vehicle.get("line", ""),
                          "destination": old_vehicle.get("destination", ""),
                          "direction": old_vehicle.get("direction", ""),
                      },
                      "lastSeenAt": str(old_vehicle.get("time") or ""),
                      "firstMissingAt": LOCAL_NOW.isoformat(timespec="seconds"),
                      "consecutiveMissing": 0,
                      "requiredMissing": 4,
                      "notificationQueued": False,
                      "alerted": False,
                  }

              if int(empty_feed_state.get("consecutiveChecks", 0)) >= 4 and empty_elapsed_seconds >= 6 * 60:
                  for vehicle_id, candidate in list(pending_vehicles.items()):
                      if candidate.get("alerted") or candidate.get("notificationQueued"):
                          continue
                      last_known = candidate.get("lastKnown", {})
                      first_missing = candidate.get("firstMissingAt") or empty_feed_state.get("firstObservedAt", "")
                      event_payload = {
                          "vehicleId": vehicle_id,
                          "firstMissingAt": first_missing,
                      }
                      event_id = stable_event_id("missing", event_payload)
                      checks = max(
                          int(candidate.get("consecutiveMissing", 0)),
                          int(empty_feed_state.get("consecutiveChecks", 0)),
                      )
                      outbox.setdefault(event_id, {
                          "eventId": event_id,
                          "type": "vehicle_missing",
                          "vehicleId": vehicle_id,
                          "line": last_known.get("line", ""),
                          "destination": last_known.get("destination", ""),
                          "direction": last_known.get("direction", ""),
                          "lastSeenAt": candidate.get("lastSeenAt", ""),
                          "firstMissingAt": first_missing,
                          "detectedAt": LOCAL_NOW.isoformat(timespec="minutes"),
                          "missingChecks": checks,
                          "queuedAt": LOCAL_NOW.isoformat(timespec="seconds"),
                      })
                      candidate["eventId"] = event_id
                      candidate["notificationQueued"] = True
                      candidate["consecutiveMissing"] = checks
                      candidate["requiredMissing"] = max(4, int(candidate.get("requiredMissing", 4)))
                      missing_confirmed_count += 1
                  last_non_empty_vehicles = {}
                  empty_feed_state["departuresConfirmed"] = True
                  print("Feed vacío confirmado durante al menos seis minutos; se han puesto en cola los vehículos que dejaron de aparecer.")
          else:
              empty_feed_state = {
                  "consecutiveChecks": 0,
                  "firstObservedAt": "",
                  "departuresConfirmed": False,
              }
              if current_count > 0:
                  last_non_empty_vehicles = dict(current_by_id)

          # Reappearance above resets tracking. Expired pending candidates are pruned,
          # but queued alerts survive until Telegram accepts them.
          for vehicle_id, candidate in list(pending_vehicles.items()):
              first_missing = parse_time(candidate.get("firstMissingAt"))
              if first_missing and (NOW - first_missing).total_seconds() > 60 * 60 and not candidate.get("notificationQueued"):
                  pending_vehicles.pop(vehicle_id, None)

          alert_state["schemaVersion"] = 1
          alert_state["pendingVehicles"] = pending_vehicles
          alert_state["pendingArrivals"] = pending_arrivals
          alert_state["lastNonEmptyVehicles"] = last_non_empty_vehicles
          alert_state["emptyFeedState"] = empty_feed_state
          alert_state["outbox"] = outbox
          with open(STATE_PATH, "w", encoding="utf-8") as handle:
              json.dump(alert_state, handle, ensure_ascii=False, indent=2, sort_keys=True)
              handle.write("\n")

          print("Vehículos con variaciones de ruta pendientes de confirmar: " + str(route_change_count) + ".")
          print("Cambios de ruta confirmados para aviso: " + str(confirmed_route_count) + ".")
          print("Entradas en servicio confirmadas para aviso: " + str(confirmed_entry_count) + ".")
          print("Desapariciones confirmadas para aviso: " + str(missing_confirmed_count) + ".")
          print("Avisos pendientes en cola duradera: " + str(len(outbox)) + ".")
          # Save stops as a compact public dictionary as well as enriching every vehicle.
          if stops:
              with open("stops.json", "w", encoding="utf-8") as handle:
                  json.dump({
                      "fetchedAt": (NOW.isoformat(timespec="seconds") if stops_refreshed else stops_doc.get("fetchedAt", NOW.isoformat(timespec="seconds"))),
                      "cacheVersion": (STATIC_CACHE_VERSION if stops_refreshed else stops_doc.get("cacheVersion", "")),
                      "source": stops_source or stops_doc.get("source", ""),
                      "count": len(stops),
                      "stops": list(stops.values()),
                  }, handle, ensure_ascii=False, separators=(",", ":"))

          with open("vehicles.json", "w", encoding="utf-8") as handle:
              json.dump(snapshot, handle, ensure_ascii=False, indent=2)

          with open("vehicles-data.js", "w", encoding="utf-8") as handle:
              handle.write("window.BIZKAIBUS_DATA = ")
              json.dump(snapshot, handle, ensure_ascii=False, separators=(",", ":"))
              handle.write(";")

          print("SIRI: " + str(len(activities)) + " actividades; vehículos procesados: " + str(len(vehicles)))
          print("Paradas conocidas: " + str(len(stops)) + "; vehículos enlazados con nombre de parada: " + str(joined_stops))
          sources = {}
          for vehicle in vehicles:
              source = vehicle.get("destinationSource") or "sin destino"
              sources[source] = sources.get(source, 0) + 1
          print("Destinos encontrados: " + str(joined_destinations) + "; referencias SIRI con datos de destino: " + str(len(trip_updates)))
          print("Fuentes de destino: " + json.dumps(sources, ensure_ascii=False))
          print("Bloque de vehículo GTFS disponible: " + str(snapshot["vehicleBlocks"]) + "/" + str(len(vehicles)))
          print("Nombre corto de viaje GTFS disponible: " + str(snapshot["tripShortNames"]) + "/" + str(len(vehicles)))
          print("Número de servicio inferido del VehicleJourneyRef: " + str(snapshot["vehiclesWithServiceNumber"]) + "/" + str(len(vehicles)))
          print("Vehículos con próximas paradas: " + str(snapshot["vehiclesWithUpcomingStops"]) + "/" + str(len(vehicles)))
          print("Vehículos con al menos una hora estimada GTFS-RT: " + str(snapshot["vehiclesWithRealtimeStopTimes"]) + "/" + str(len(vehicles)))
          PY

      - name: Guardar los datos públicos si han cambiado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Los datos no han cambiado; no hay commit que crear."
          else
            git commit -m "Actualizar posiciones, paradas y destinos Bizkaibus"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Validar Telegram y enviar alertas pendientes
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import time
          import urllib.error
          import urllib.request

          token = (os.environ.get("TELEGRAM_BOT_TOKEN") or "").strip()
          chat_id = (os.environ.get("TELEGRAM_CHAT_ID") or "").strip()
          event_name = (os.environ.get("GITHUB_EVENT_NAME") or "").strip()
          state_path = "vehicle-alert-state.json"

          if not token or not chat_id:
              print("ERROR: faltan TELEGRAM_BOT_TOKEN o TELEGRAM_CHAT_ID en los secretos de Actions.")
              sys.exit(1)

          try:
              with open(state_path, encoding="utf-8") as handle:
                  state = json.load(handle)
          except FileNotFoundError:
              state = {"schemaVersion": 1, "pendingVehicles": {}, "outbox": {}}
          except Exception as exc:
              print("ERROR: no se pudo leer la cola de alertas: " + str(exc))
              sys.exit(1)

          pending = state.get("pendingVehicles", {})
          outbox = state.get("outbox", {})
          if not isinstance(pending, dict):
              pending = {}
          if not isinstance(outbox, dict):
              outbox = {}

          def safe(value):
              return str(value or "No disponible").strip()

          def telegram_api(method, payload):
              # Reintentos acotados ante límites de Telegram y errores transitorios.
              # En sendMessage, un timeout puede ocurrir después de que Telegram acepte
              # el mensaje; el reintento prioriza no perder alertas y podría duplicar ese caso raro.
              endpoint = "https://api.telegram.org/bot" + token + "/" + method
              last_error = None
              for attempt in range(4):
                  request = urllib.request.Request(
                      endpoint,
                      data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
                      headers={"Content-Type": "application/json"},
                      method="POST",
                  )
                  try:
                      with urllib.request.urlopen(request, timeout=20) as response:
                          raw = response.read().decode("utf-8")
                      result = json.loads(raw)
                      if not result.get("ok"):
                          description = safe(result.get("description"))
                          retry_after = (result.get("parameters") or {}).get("retry_after")
                          if retry_after and attempt < 3:
                              wait_seconds = min(60, max(1, int(retry_after)))
                              print(method + ": Telegram solicita esperar " + str(wait_seconds) + " s.")
                              time.sleep(wait_seconds)
                              continue
                          raise RuntimeError(method + ": " + description)
                      return result.get("result", {})
                  except urllib.error.HTTPError as exc:
                      try:
                          body = json.loads(exc.read().decode("utf-8"))
                          detail = body.get("description", "")
                          retry_after = (body.get("parameters") or {}).get("retry_after")
                      except Exception:
                          detail = ""
                          retry_after = None
                      last_error = RuntimeError(method + " devolvió HTTP " + str(exc.code) + (": " + detail if detail else ""))
                      retryable = exc.code == 429 or 500 <= exc.code <= 599
                      if not retryable or attempt >= 3:
                          raise last_error
                      wait_seconds = min(60, max(1, int(retry_after))) if retry_after else min(8, 2 ** attempt)
                  except (urllib.error.URLError, TimeoutError, OSError, json.JSONDecodeError) as exc:
                      last_error = exc
                      if attempt >= 3:
                          raise RuntimeError(method + " falló tras varios intentos: " + str(exc))
                      wait_seconds = min(8, 2 ** attempt)
                  print(method + ": error transitorio; reintento " + str(attempt + 2) + "/4 en " + str(wait_seconds) + " s.")
                  time.sleep(wait_seconds)
              raise RuntimeError(method + " falló: " + str(last_error))

          try:
              bot_info = telegram_api("getMe", {})
              chat_info = telegram_api("getChat", {"chat_id": chat_id})
              print("Token de Telegram validado para @" + safe(bot_info.get("username")) + ".")
              print("Chat de destino validado (tipo " + safe(chat_info.get("type")) + ").")
          except Exception as exc:
              print("ERROR de conexión/configuración de Telegram: " + str(exc))
              sys.exit(1)

          # Poll commands occasionally so /start and /help receive a reply.
          # A webhook conflict must not disable the vehicle-alert sender.
          state_dirty = False
          try:
              update_offset = max(0, int(state.get("telegramUpdateOffset", 0) or 0))
              updates = telegram_api("getUpdates", {
                  "offset": update_offset,
                  "timeout": 0,
                  "allowed_updates": ["message"],
              })
          except Exception as exc:
              print("AVISO: no se pudieron consultar comandos de Telegram; las alertas de vehículos seguirán funcionando: " + str(exc))
              updates = []
              update_offset = max(0, int(state.get("telegramUpdateOffset", 0) or 0))

          expected_chat_id = str(chat_info.get("id") or chat_id)
          highest_processed_update = update_offset - 1
          for update in sorted(updates, key=lambda item: int(item.get("update_id", -1))):
              try:
                  update_id = int(update.get("update_id", -1))
              except (TypeError, ValueError):
                  continue
              message = update.get("message") or {}
              incoming_chat_id = str((message.get("chat") or {}).get("id", ""))
              raw_text = (message.get("text") or "").strip()
              if incoming_chat_id == expected_chat_id and raw_text:
                  command = raw_text.split()[0].split("@")[0].lower()
                  if command in ("/start", "/help"):
                      try:
                          telegram_api("sendMessage", {
                              "chat_id": chat_id,
                              "text": "🚌 SAE Bizkaibus está conectado.\n\nTe enviaré avisos cuando detecte cambios publicados de línea, destino o sentido, y cuando un vehículo deje de aparecer en el feed durante varias consultas consecutivas.\n\nLa desaparición del feed no demuestra por sí sola una baja administrativa: también puede ser el fin de un servicio o un fallo de publicación.\n\nLa consulta rápida está diseñada para ejecutarse aproximadamente cada 2 minutos cuando el planificador externo está activo; la publicación final también depende del tiempo de procesamiento.\nConsulta SAE: https://enekituss.github.io/sae/",
                              "disable_web_page_preview": True,
                          })
                          print("Comando " + command + " atendido.")
                      except Exception as exc:
                          print("ERROR al responder a " + command + ": " + str(exc))
                          break
              highest_processed_update = update_id
          if highest_processed_update >= update_offset:
              state["telegramUpdateOffset"] = highest_processed_update + 1
              state_dirty = True
              print("Actualizaciones de Telegram procesadas hasta el ID " + str(highest_processed_update) + ".")

          # No enviar mensajes de prueba en workflow_dispatch: el Worker usa
          # ese evento para actualizar el feed periódicamente. Telegram solo debe
          # recibir avisos reales generados por cambios confirmados en vehículos.

          events = sorted(
              outbox.values(),
              key=lambda event: (str(event.get("queuedAt", "")), str(event.get("eventId", ""))),
          )
          if not events:
              print("No hay avisos de ruta o desaparición pendientes. Telegram se ha validado correctamente.")

          def render_event(event):
              vehicle_id = safe(event.get("vehicleId"))
              if event.get("type") == "vehicle_missing":
                  last_seen = safe(event.get("lastSeenAt"))
                  if last_seen != "No disponible":
                      try:
                          from datetime import datetime
                          from zoneinfo import ZoneInfo
                          last_seen_dt = datetime.fromisoformat(last_seen.replace("Z", "+00:00"))
                          if last_seen_dt.tzinfo is None:
                              last_seen_dt = last_seen_dt.replace(tzinfo=ZoneInfo("UTC"))
                          last_seen = last_seen_dt.astimezone(ZoneInfo("Europe/Madrid")).strftime("%d/%m/%Y %H:%M:%S")
                      except Exception:
                          pass
                  lines = [
                      "⚠️ VEHÍCULO SIN POSICIÓN RECIENTE (POSIBLE FIN DE SERVICIO)",
                      "Vehículo: " + vehicle_id,
                      "Última línea realizada según el SAE: " + safe(event.get("line")),
                      "Último destino publicado: " + safe(event.get("destination")),
                      "Último sentido publicado: " + safe(event.get("direction")),
                      "Última detección en el SAE: " + last_seen,
                      "Confirmación: " + safe(event.get("missingChecks")) + " consultas consecutivas válidas.",
                      "Importante: el SAE ya no dispone de una posición reciente de este vehículo, o ha desaparecido de la lista. No prueba por sí solo una baja administrativa ni que esté físicamente fuera de servicio.",
                      "Hora del aviso: " + safe(event.get("detectedAt")),
                  ]
              elif event.get("type") == "vehicle_entered":
                  first_seen = safe(event.get("firstObservedAt"))
                  if first_seen != "No disponible":
                      try:
                          from datetime import datetime
                          from zoneinfo import ZoneInfo
                          first_seen_dt = datetime.fromisoformat(first_seen.replace("Z", "+00:00"))
                          if first_seen_dt.tzinfo is None:
                              first_seen_dt = first_seen_dt.replace(tzinfo=ZoneInfo("UTC"))
                          first_seen = first_seen_dt.astimezone(ZoneInfo("Europe/Madrid")).strftime("%d/%m/%Y %H:%M:%S")
                      except Exception:
                          pass
                  lines = [
                      "🟢 AUTOBÚS DETECTADO ENTRANDO EN SERVICIO",
                      "Vehículo: " + vehicle_id,
                      "Línea actual: " + safe(event.get("line")),
                      "Destino actual: " + safe(event.get("destination")),
                      "Sentido actual: " + safe(event.get("direction")),
                      "Primera detección: " + first_seen,
                      "Confirmación: aparece en dos actualizaciones SIRI consecutivas separadas al menos dos minutos.",
                      "Nota: el aviso confirma su aparición en el feed; no es una señal administrativa de alta del operador.",
                      "Hora del aviso: " + safe(event.get("detectedAt")),
                  ]
              elif event.get("type") == "vehicle_returned":
                  last_known = event.get("lastKnown", {})
                  lines = [
                      "✅ AUTOBÚS REAPARECE EN EL FEED",
                      "Vehículo: " + vehicle_id,
                      "Línea actual: " + safe(event.get("line")),
                      "Destino actual: " + safe(event.get("destination")),
                      "Antes de desaparecer: línea " + safe(last_known.get("line")) + ", destino " + safe(last_known.get("destination")),
                      "Detectado: " + safe(event.get("detectedAt")),
                  ]
              else:
                  is_route_after_gap = event.get("type") == "route_change_after_gap"
                  title = "🔁 CAMBIO DETECTADO TRAS REAPARICIÓN" if is_route_after_gap else "🚌 CAMBIO DE RUTA DETECTADO"
                  lines = [
                      title,
                      "Vehículo: " + vehicle_id,
                  ]
                  labels = {"line": "Línea", "destination": "Destino", "direction": "Sentido"}
                  for item in event.get("changed", []):
                      field = item.get("field")
                      old_value = safe(item.get("old"))
                      new_value = safe(item.get("new"))
                      if is_route_after_gap and field == "line":
                          lines.append("Última línea realizada según el SAE: " + old_value)
                          lines.append("Nueva línea en la que aparece ahora: " + new_value)
                      else:
                          label = labels.get(field, safe(item.get("label")))
                          lines.append(label + ": " + old_value + " → " + new_value)
                  lines.append("Hora del aviso: " + safe(event.get("detectedAt")))
              return "\n".join(lines)

          delivered_ids = []
          failed_events = []
          max_events_per_run = 50
          selected_events = events[:max_events_per_run]
          for index, event in enumerate(selected_events):
              try:
                  telegram_api("sendMessage", {
                      "chat_id": chat_id,
                      "text": render_event(event) + "\n\nConsulta SAE: https://enekituss.github.io/sae/",
                      "disable_web_page_preview": True,
                  })
                  if event.get("eventId"):
                      delivered_ids.append(str(event.get("eventId")))
                  print("Telegram aceptó un aviso individual del vehículo " + safe(event.get("vehicleId")) + ".")
              except Exception as exc:
                  failed_events.append((event, str(exc)))
                  print("ERROR al enviar el aviso individual del vehículo " + safe(event.get("vehicleId")) + ": " + str(exc))
              if index + 1 < len(selected_events):
                  time.sleep(1.1)

          if delivered_ids:
              for event_id in delivered_ids:
                  event = outbox.pop(event_id, None)
                  if not event:
                      continue
                  if event.get("type") == "vehicle_missing":
                      vehicle_id = str(event.get("vehicleId") or "")
                      candidate = pending.get(vehicle_id)
                      if candidate and candidate.get("eventId") == event_id:
                          candidate["alerted"] = True
                          candidate["notificationQueued"] = False
              state_dirty = True

          if state_dirty:
              state["schemaVersion"] = 1
              state["pendingVehicles"] = pending
              state["outbox"] = outbox
              with open(state_path, "w", encoding="utf-8") as handle:
                  json.dump(state, handle, ensure_ascii=False, indent=2, sort_keys=True)
                  handle.write("\n")

              try:
                  subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
                  subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
                  subprocess.run(["git", "add", state_path], check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
                  diff = subprocess.run(["git", "diff", "--cached", "--quiet"], check=False, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
                  if diff.returncode == 1:
                      subprocess.run(["git", "commit", "-m", "Guardar estado de Telegram y confirmar avisos"], check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
                      subprocess.run(["git", "fetch", "origin", "main"], check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
                      subprocess.run(["git", "rebase", "origin/main"], check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
                      subprocess.run(["git", "push", "origin", "HEAD:main"], check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
                      print("Estado de Telegram guardado en GitHub.")
                  elif diff.returncode != 0:
                      raise RuntimeError("git diff devolvió el código " + str(diff.returncode))
              except Exception as exc:
                  print("ERROR al guardar el estado de Telegram. Un aviso podría repetirse en el próximo intento: " + str(exc))
                  sys.exit(1)

          if len(events) > len(selected_events):
              print("Quedan " + str(len(events) - len(selected_events)) + " avisos en cola para próximos ciclos.")
          if failed_events:
              print("ERROR: " + str(len(failed_events)) + " aviso(s) individual(es) no se pudieron enviar; permanecerán en cola para reintentar.")
              sys.exit(1)
          print("Proceso de alertas terminado. Avisos enviados: " + str(len(delivered_ids)) + "; pendientes restantes: " + str(len(outbox)) + ".")
          PY
