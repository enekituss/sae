name: Actualizar posiciones Bizkaibus

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-siri.yml"

permissions:
  contents: write

concurrency:
  group: actualizar-feed-bizkaibus
  cancel-in-progress: true

jobs:
  refresh-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Cache GTFS oficial de producción
        uses: actions/cache@v4
        with:
          path: /tmp/bizkaibus-gtfs/Bizkaibus.zip
          key: bizkaibus-gtfs-production-2026-10-v2

      - name: Preparar lector GTFS-Realtime
        run: python -m pip install --quiet --disable-pip-version-check gtfs-realtime-bindings
        continue-on-error: true

      - name: Descargar SIRI y enriquecer paradas, destinos y horarios
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import io
          import json
          import os
          import re
          import urllib.request
          import xml.etree.ElementTree as ET
          import zipfile
          from datetime import datetime, timezone, timedelta
          from zoneinfo import ZoneInfo

          POSITIONS_URL = "https://ctb-siri.s3.eu-south-2.amazonaws.com/bizkaibus-vehicle-positions.xml"
          TRIP_UPDATES_URL = "https://ctb-siri.s3.eu-south-2.amazonaws.com/bizkaibus-trip-updates.xml"
          GTFS_RT_UPDATES_URL = "https://baliabideak.bizkaia.eus/Bizkaibus/GTFSRealTime/FeedTripUpdates.pb"
          PARADAS_API_URL = "https://apps.bizkaia.eus/BBOA000M/rest/BBOA/GetParadas"
          GTFS_BASE = "https://baliabideak.bizkaia.eus/Bizkaibus/GTFS/"
          GTFS_ZIP_URL = GTFS_BASE + "Bizkaibus.zip"
          GTFS_CACHE_FILE = "/tmp/bizkaibus-gtfs/Bizkaibus.zip"
          STATIC_CACHE_VERSION = "production-gtfs-2026-10-v2"
          LOCAL_TZ = ZoneInfo("Europe/Madrid")
          NOW = datetime.now(timezone.utc)
          LOCAL_NOW = datetime.now(LOCAL_TZ)
          gtfs_zip_bytes = None

          def fetch_bytes(url, timeout=15):
              req = urllib.request.Request(url, headers={
                  "User-Agent": "Bizkaibus-Spotter/1.0 (+https://github.com/enekituss/sae)",
                  "Accept": "application/xml, text/xml, text/csv, */*",
              })
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  return response.read()

          def ensure_gtfs_zip():
              global gtfs_zip_bytes
              if gtfs_zip_bytes is not None:
                  return gtfs_zip_bytes
              if os.path.isfile(GTFS_CACHE_FILE):
                  with open(GTFS_CACHE_FILE, "rb") as handle:
                      gtfs_zip_bytes = handle.read()
                  print("Usando ZIP GTFS de caché (" + str(len(gtfs_zip_bytes)) + " bytes).")
              else:
                  print("Descargando GTFS oficial de producción: " + GTFS_ZIP_URL)
                  gtfs_zip_bytes = fetch_bytes(GTFS_ZIP_URL, timeout=60)
                  os.makedirs(os.path.dirname(GTFS_CACHE_FILE), exist_ok=True)
                  with open(GTFS_CACHE_FILE, "wb") as handle:
                      handle.write(gtfs_zip_bytes)
                  print("ZIP GTFS descargado (" + str(len(gtfs_zip_bytes)) + " bytes).")
              return gtfs_zip_bytes

          def gtfs_file(filename):
              archive_data = ensure_gtfs_zip()
              with zipfile.ZipFile(io.BytesIO(archive_data)) as archive:
                  candidates = [n for n in archive.namelist() if n.rsplit("/", 1)[-1].lower() == filename.lower()]
                  if not candidates:
                      raise RuntimeError("El ZIP GTFS no contiene " + filename)
                  return archive.read(candidates[0])

          def gtfs_rows(filename):
              archive_data = ensure_gtfs_zip()
              with zipfile.ZipFile(io.BytesIO(archive_data)) as archive:
                  candidates = [n for n in archive.namelist() if n.rsplit("/", 1)[-1].lower() == filename.lower()]
                  if not candidates:
                      raise RuntimeError("El ZIP GTFS no contiene " + filename)
                  with archive.open(candidates[0], "r") as binary:
                      with io.TextIOWrapper(binary, encoding="utf-8-sig", newline="") as stream:
                          reader = csv.DictReader(stream)
                          for row in reader:
                              yield row

          def local(tag):
              return tag.rsplit("}", 1)[-1]

          def norm_tag(tag):
              return re.sub(r"[^a-z0-9]", "", local(tag).lower())

          def children_text(element):
              result = {}
              for child in list(element):
                  val = (child.text or "").strip()
                  if val:
                      result[norm_tag(child.tag)] = val
              return result

          def descendant_values(element):
              result = {}
              for child in element.iter():
                  val = (child.text or "").strip()
                  if val and norm_tag(child.tag) not in result:
                      result[norm_tag(child.tag)] = val
              return result

          def pick(values, names):
              for name in names:
                  val = values.get(re.sub(r"[^a-z0-9]", "", name.lower()), "")
                  if val:
                      return val
              return ""

          def value(element, *names):
              if element is None:
                  return ""
              vals = descendant_values(element)
              return pick(vals, list(names))

          def parse_time(value):
              if not value:
                  return None
              try:
                  dt = datetime.fromisoformat(value.replace("Z", "+00:00"))
                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=timezone.utc)
                  return dt
              except (ValueError, TypeError):
                  return None

          def is_fresh(path, age_days):
              if not os.path.exists(path):
                  return False
              try:
                  with open(path, encoding="utf-8") as handle:
                      obj = json.load(handle)
                  stamp = parse_time(obj.get("fetchedAt"))
                  return stamp is not None and (NOW - stamp).total_seconds() < age_days * 86400
              except Exception:
                  return False

          # Stops: keep a cache so we do not download static data on every 5-min poll.
          # Prefer Bizkaia's official stop-list endpoint, with the public GTFS file as fallback.
          stops_doc = {}
          stops_source = ""
          if os.path.exists("stops.json"):
              try:
                  with open("stops.json", encoding="utf-8") as handle:
                      stops_doc = json.load(handle)
              except Exception:
                  stops_doc = {}

          stops = {}
          stops_refreshed = False
          if is_fresh("stops.json", 7) and stops_doc.get("cacheVersion") == STATIC_CACHE_VERSION and isinstance(stops_doc.get("stops"), list):
              stops = {str(s.get("id", "")): s for s in stops_doc["stops"] if s.get("id")}
              stops_source = stops_doc.get("source", "cache local")
              print("Usando caché de paradas: " + str(len(stops)))
          else:
              id_names = [
                  "stop_id", "StopPointRef", "CodigoParada", "IdParada", "ParadaId",
                  "CodigoPuntoParada", "StopId", "StopCode", "Codigo", "Id"
              ]
              name_names = [
                  "stop_name", "NombreParada", "DenominacionParada", "DescripcionParada",
                  "Nombre", "Denominacion", "Descripcion", "DParada", "Parada"
              ]
              lat_names = ["stop_lat", "Latitud", "Latitude", "Lat", "Y"]
              lon_names = ["stop_lon", "Longitud", "Longitude", "Lon", "X"]

              # Current production GTFS ZIP is newer and easier to parse reliably.
              try:
                  raw = gtfs_file("stops.txt")
                  reader = csv.DictReader(io.StringIO(raw.decode("utf-8-sig")))
                  for row in reader:
                      sid = (row.get("stop_id") or "").strip()
                      name = (row.get("stop_name") or "").strip()
                      if not sid or not name:
                          continue
                      stops[sid] = {
                          "id": sid,
                          "name": name,
                          "lat": (row.get("stop_lat") or "").strip(),
                          "lon": (row.get("stop_lon") or "").strip(),
                          "municipality": (row.get("municipality") or row.get("parent_station") or "").strip(),
                      }
                  if len(stops) >= 50:
                      stops_source = GTFS_ZIP_URL + " (stops.txt)"
                      stops_refreshed = True
                      print("Paradas recuperadas del GTFS oficial: " + str(len(stops)))
                  else:
                      stops = {}
                      print("El archivo stops.txt del GTFS no contiene un listado reconocible.")
              except Exception as exc:
                  stops = {}
                  print("No se pudo leer stops.txt del GTFS oficial: " + str(exc))

              # Last fallback: Bizkaia's official XML API.
              if not stops:
                  id_names = ["stop_id", "StopPointRef", "CodigoParada", "IdParada", "ParadaId", "CodigoPuntoParada", "StopId", "StopCode", "Codigo", "Id"]
                  name_names = ["stop_name", "NombreParada", "DenominacionParada", "DescripcionParada", "Nombre", "Denominacion", "Descripcion", "DParada", "Parada"]
                  lat_names = ["stop_lat", "Latitud", "Latitude", "Lat", "Y"]
                  lon_names = ["stop_lon", "Longitud", "Longitude", "Lon", "X"]
                  try:
                      raw = fetch_bytes(PARADAS_API_URL, timeout=12)
                      root = ET.fromstring(raw)
                      found = {}
                      for element in root.iter():
                          direct = children_text(element)
                          sid = pick(direct, id_names)
                          name = pick(direct, name_names)
                          vals = direct if sid and name else descendant_values(element)
                          sid = sid or pick(vals, id_names)
                          name = name or pick(vals, name_names)
                          if not sid or not name:
                              continue
                          sid = sid.strip()
                          found[sid] = {
                              "id": sid,
                              "name": name.strip(),
                              "lat": pick(vals, lat_names),
                              "lon": pick(vals, lon_names),
                              "municipality": pick(vals, ["Municipio", "Municipality", "NombreMunicipio"]),
                          }
                      if len(found) >= 50:
                          stops = found
                          stops_source = PARADAS_API_URL
                          stops_refreshed = True
                          print("Paradas recuperadas del API oficial: " + str(len(stops)))
                  except Exception as exc:
                      print("No se pudo leer GetParadas: " + str(exc))

          # Create aliases for common StopPointRef formats (for example "4157" and "stop:4157").
          stop_index = {}
          aliases_ambiguous = set()
          def add_stop_alias(alias, item):
              if not alias:
                  return
              if alias in stop_index and stop_index[alias].get("id") != item.get("id"):
                  aliases_ambiguous.add(alias)
              else:
                  stop_index[alias] = item

          for sid, item in stops.items():
              add_stop_alias(str(sid).strip().lower(), item)
              numeric = re.fullmatch(r"0*(\d+)", str(sid).strip())
              if numeric:
                  add_stop_alias(numeric.group(1), item)
              else:
                  suffix = re.search(r"(\d+)$", str(sid).strip())
                  if suffix:
                      add_stop_alias(suffix.group(1), item)
          for alias in aliases_ambiguous:
              stop_index.pop(alias, None)

          # Destinations: SIRI trip-updates first, then the GTFS trip_headsign as fallback.
          trip_updates = {}
          try:
              raw = fetch_bytes(TRIP_UPDATES_URL, timeout=18)
              trip_root = ET.fromstring(raw)
              for element in trip_root.iter():
                  if local(element.tag) not in ("EstimatedVehicleJourney", "MonitoredVehicleJourney", "VehicleJourney", "TripUpdate"):
                      continue
                  jref = value(element, "VehicleJourneyRef", "DatedVehicleJourneyRef")
                  if not jref:
                      continue
                  dest_name = value(element, "DestinationName", "DestinationDisplay", "DestinationText", "JourneyEndName")
                  dest_ref = value(element, "DestinationRef")
                  direction = value(element, "DirectionName")
                  if dest_name or dest_ref or direction:
                      current = trip_updates.get(jref, {})
                      current["destination"] = current.get("destination") or dest_name
                      current["destinationRef"] = current.get("destinationRef") or dest_ref
                      current["direction"] = current.get("direction") or direction
                      trip_updates[jref] = current
              print("Referencias de viaje con datos de destino en SIRI-trip-updates: " + str(len(trip_updates)))
          except Exception as exc:
              print("No se pudo leer trip-updates SIRI; se usará el GTFS cuando sea posible: " + str(exc))

          gtfs_doc = {}
          if os.path.exists("gtfs-trips.json"):
              try:
                  with open("gtfs-trips.json", encoding="utf-8") as handle:
                      gtfs_doc = json.load(handle)
              except Exception:
                  gtfs_doc = {}

          trips = {}
          if is_fresh("gtfs-trips.json", 14) and gtfs_doc.get("cacheVersion") == STATIC_CACHE_VERSION and isinstance(gtfs_doc.get("trips"), dict):
              trips = gtfs_doc["trips"]
              print("Usando caché GTFS de destinos: " + str(len(trips)))
          else:
              try:
                  raw = gtfs_file("trips.txt")
                  reader = csv.DictReader(io.StringIO(raw.decode("utf-8-sig")))
                  for row in reader:
                      tid = (row.get("trip_id") or "").strip()
                      headsign = (row.get("trip_headsign") or "").strip()
                      if not tid:
                          continue
                      item = {
                          "trip_id": tid,
                          "headsign": headsign,
                          "route_id": (row.get("route_id") or "").strip(),
                          "direction_id": (row.get("direction_id") or "").strip(),
                          "service_id": (row.get("service_id") or "").strip(),
                          "trip_short_name": (row.get("trip_short_name") or "").strip(),
                          "block_id": (row.get("block_id") or "").strip(),
                      }
                      trips[tid] = item
                      if tid.startswith("trp_"):
                          trips.setdefault(tid[4:], item)
                      else:
                          trips.setdefault("trp_" + tid, item)
                  if trips:
                      with open("gtfs-trips.json", "w", encoding="utf-8") as handle:
                          json.dump({
                              "fetchedAt": NOW.isoformat(timespec="seconds"),
                              "cacheVersion": STATIC_CACHE_VERSION,
                              "source": GTFS_ZIP_URL + " (trips.txt)",
                              "trips": trips,
                          }, handle, ensure_ascii=False, separators=(",", ":"))
                      print("Destinos GTFS recuperados: " + str(len(trips)))
              except Exception as exc:
                  print("No se pudo leer trips.txt: " + str(exc))
                  if isinstance(gtfs_doc.get("trips"), dict):
                      trips = gtfs_doc["trips"]

          # Read current vehicle positions.
          root = ET.fromstring(fetch_bytes(POSITIONS_URL, timeout=25))
          activities = [e for e in root.iter() if local(e.tag) == "VehicleActivity"]
          if not activities and not any(local(e.tag) == "VehicleMonitoringDelivery" for e in root.iter()):
              raise RuntimeError("La URL respondió, pero no contiene una respuesta SIRI de posiciones.")

          # Parse the official public GTFS-Realtime Trip Updates feed.
          # This is the source for live ETAs; static GTFS stop_times remains a fallback.
          realtime_updates = {}
          realtime_trip_count = 0
          realtime_stop_update_count = 0
          realtime_feed_timestamp = None
          try:
              from google.transit import gtfs_realtime_pb2
              rt_bytes = fetch_bytes(GTFS_RT_UPDATES_URL, timeout=20)
              rt_feed = gtfs_realtime_pb2.FeedMessage()
              rt_feed.ParseFromString(rt_bytes)
              if rt_feed.header.timestamp:
                  realtime_feed_timestamp = datetime.fromtimestamp(rt_feed.header.timestamp, timezone.utc)
              for entity in rt_feed.entity:
                  if not entity.HasField("trip_update"):
                      continue
                  trip_update = entity.trip_update
                  trip_id = trip_update.trip.trip_id if trip_update.HasField("trip") else ""
                  if not trip_id:
                      continue
                  entry_timestamp = int(trip_update.timestamp) if trip_update.timestamp else (
                      int(realtime_feed_timestamp.timestamp()) if realtime_feed_timestamp else 0
                  )
                  stop_updates = []
                  for stop_update in trip_update.stop_time_update:
                      row_update = {
                          "stopSequence": int(stop_update.stop_sequence) if stop_update.stop_sequence else None,
                          "stopId": (stop_update.stop_id or "").strip(),
                          "relationship": int(stop_update.schedule_relationship),
                      }
                      if stop_update.HasField("arrival"):
                          event = stop_update.arrival
                          if event.time:
                              row_update["arrivalEpoch"] = int(event.time)
                          if event.HasField("delay"):
                              row_update["arrivalDelay"] = int(event.delay)
                      if stop_update.HasField("departure"):
                          event = stop_update.departure
                          if event.time:
                              row_update["departureEpoch"] = int(event.time)
                          if event.HasField("delay"):
                              row_update["departureDelay"] = int(event.delay)
                      if len(row_update) > 3:
                          stop_updates.append(row_update)
                  entry = {
                      "tripId": trip_id,
                      "vehicleId": (trip_update.vehicle.id or "").strip() if trip_update.HasField("vehicle") else "",
                      "timestamp": entry_timestamp,
                      "stops": stop_updates,
                  }
                  realtime_updates[trip_id] = entry
                  if trip_id.startswith("trp_"):
                      realtime_updates.setdefault(trip_id[4:], entry)
                  else:
                      realtime_updates.setdefault("trp_" + trip_id, entry)
                  realtime_trip_count += 1
                  realtime_stop_update_count += len(stop_updates)
              print("GTFS-RT TripUpdates: " + str(realtime_trip_count) + " viajes; " + str(realtime_stop_update_count) + " actualizaciones de parada.")
          except Exception as exc:
              print("No se pudo leer el feed GTFS-RT de actualizaciones; se usará el horario estático: " + str(exc))

          # Find each currently active trip's GTFS ID, then scan stop_times.txt once,
          # retaining only those trips. The ZIP is cached by GitHub Actions between runs.
          active_gtfs_trip_ids = set()
          trip_id_by_ref = {}
          service_date_by_trip = {}
          for activity in activities:
              journeys = [e for e in activity.iter() if local(e.tag) == "MonitoredVehicleJourney"]
              if not journeys:
                  continue
              journey = journeys[0]
              ref = value(journey, "VehicleJourneyRef", "DatedVehicleJourneyRef") or value(activity, "VehicleJourneyRef", "DatedVehicleJourneyRef")
              if not ref:
                  continue
              trip_meta = trips.get(ref, {}) or trips.get(ref[4:] if ref.startswith("trp_") else "trp_" + ref, {})
              trip_id = trip_meta.get("trip_id") or ref
              trip_id_by_ref[ref] = trip_id
              active_gtfs_trip_ids.add(trip_id)
              active_gtfs_trip_ids.add(ref)
              if ref.startswith("trp_"):
                  active_gtfs_trip_ids.add(ref[4:])
              else:
                  active_gtfs_trip_ids.add("trp_" + ref)
              # SIRI JourneyRefs encode service-day seconds after the OP... token.
              # If the start is >= 24:00, GTFS times belong to the previous service date.
              time_match = re.search(r"_OP[^_]+_(\d{4,6})_", ref.upper())
              service_date = LOCAL_NOW.date()
              if time_match and int(time_match.group(1)) >= 86400:
                  service_date = service_date - timedelta(days=1)
              service_date_by_trip[trip_id] = service_date
              service_date_by_trip[ref] = service_date

          def gtfs_datetime(raw_time, service_date):
              if not raw_time:
                  return None
              try:
                  hours, minutes, seconds = [int(part) for part in raw_time.strip().split(":")]
                  midnight = datetime.combine(service_date, datetime.min.time(), tzinfo=LOCAL_TZ)
                  return midnight + timedelta(hours=hours, minutes=minutes, seconds=seconds)
              except (ValueError, TypeError):
                  return None

          schedule_by_trip = {}
          if active_gtfs_trip_ids:
              try:
                  for row in gtfs_rows("stop_times.txt"):
                      trip_id = (row.get("trip_id") or "").strip()
                      if trip_id not in active_gtfs_trip_ids:
                          continue
                      stop_id = (row.get("stop_id") or "").strip()
                      seq_text = (row.get("stop_sequence") or "").strip()
                      try:
                          sequence = int(seq_text) if seq_text else None
                      except ValueError:
                          sequence = None
                      stop_obj = stops.get(stop_id) or stop_index.get(stop_id.lower())
                      if not stop_obj:
                          numeric = re.fullmatch(r"0*(\d+)", stop_id)
                          if numeric:
                              stop_obj = stop_index.get(numeric.group(1))
                      service_date = service_date_by_trip.get(trip_id, LOCAL_NOW.date())
                      arrival_dt = gtfs_datetime((row.get("arrival_time") or "").strip(), service_date)
                      departure_dt = gtfs_datetime((row.get("departure_time") or "").strip(), service_date)
                      schedule_by_trip.setdefault(trip_id, []).append({
                          "stopId": stop_id,
                          "stopSequence": sequence,
                          "name": (stop_obj or {}).get("name", "") or stop_id,
                          "arrivalDt": arrival_dt,
                          "departureDt": departure_dt,
                      })
                  for rows in schedule_by_trip.values():
                      rows.sort(key=lambda x: (x["stopSequence"] is None, x["stopSequence"] or 0))
                  print("Horarios estáticos cargados para " + str(len(schedule_by_trip)) + " viajes activos.")
              except Exception as exc:
                  print("No se pudo leer stop_times.txt: " + str(exc))

          def realtime_entry_for(trip_id, ref, vehicle_id):
              for key in (trip_id, ref, trip_id[4:] if trip_id.startswith("trp_") else "trp_" + trip_id):
                  if key and key in realtime_updates:
                      return realtime_updates[key]
              if vehicle_id:
                  seen_entries = set()
                  for entry in realtime_updates.values():
                      marker = entry.get("tripId")
                      if marker in seen_entries:
                          continue
                      seen_entries.add(marker)
                      if entry.get("vehicleId") == vehicle_id:
                          return entry
              return None

          def iso_local(dt):
              return dt.isoformat(timespec="seconds") if dt else ""

          def compose_upcoming_stops(ref, trip_id, current_stop_id, arrival_status, vehicle_id):
              rows = schedule_by_trip.get(trip_id) or schedule_by_trip.get(ref) or []
              if not rows:
                  return [], 0
              now_local = datetime.now(LOCAL_TZ)
              current_stop_key = (current_stop_id or "").strip().lower()
              matches = [i for i, row in enumerate(rows) if current_stop_key and row["stopId"].strip().lower() == current_stop_key]
              start_index = 0
              if matches:
                  def time_distance(index):
                      dt = rows[index]["arrivalDt"] or rows[index]["departureDt"]
                      return abs((dt - now_local).total_seconds()) if dt else 10**12
                  current_index = min(matches, key=time_distance)
                  status = (arrival_status or "").lower()
                  start_index = current_index + 1 if status in ("arrived", "departed", "passed", "left") else current_index
              else:
                  future = [
                      i for i, row in enumerate(rows)
                      if (row["arrivalDt"] or row["departureDt"]) and (row["arrivalDt"] or row["departureDt"]) >= now_local - timedelta(minutes=3)
                  ]
                  start_index = future[0] if future else len(rows)

              rt_entry = realtime_entry_for(trip_id, ref, vehicle_id)
              rt_is_fresh = False
              if rt_entry and rt_entry.get("timestamp"):
                  rt_age = now_local.timestamp() - rt_entry["timestamp"]
                  rt_is_fresh = -120 <= rt_age <= 15 * 60
              rt_stops = rt_entry.get("stops", []) if rt_entry and rt_is_fresh else []
              output = []
              realtime_used = 0
              for row in rows[start_index:]:
                  rt_match = None
                  for candidate in rt_stops:
                      seq_match = row["stopSequence"] is not None and candidate.get("stopSequence") == row["stopSequence"]
                      stop_match = bool(row["stopId"] and candidate.get("stopId") and row["stopId"].strip().lower() == candidate["stopId"].strip().lower())
                      if seq_match or (row["stopSequence"] is None and stop_match) or (seq_match and stop_match):
                          rt_match = candidate
                          break
                  schedule_arrival = row["arrivalDt"]
                  schedule_departure = row["departureDt"]
                  arrival_dt = schedule_arrival
                  departure_dt = schedule_departure
                  source = "Horario GTFS"
                  status = ""

                  if rt_match and rt_match.get("relationship") == 1:
                      status = "Omitida según GTFS-RT"
                  elif rt_match:
                      rt_arrival = None
                      rt_departure = None
                      if rt_match.get("arrivalEpoch"):
                          rt_arrival = datetime.fromtimestamp(rt_match["arrivalEpoch"], timezone.utc).astimezone(LOCAL_TZ)
                      elif "arrivalDelay" in rt_match and schedule_arrival:
                          rt_arrival = schedule_arrival + timedelta(seconds=rt_match["arrivalDelay"])
                      if rt_match.get("departureEpoch"):
                          rt_departure = datetime.fromtimestamp(rt_match["departureEpoch"], timezone.utc).astimezone(LOCAL_TZ)
                      elif "departureDelay" in rt_match and schedule_departure:
                          rt_departure = schedule_departure + timedelta(seconds=rt_match["departureDelay"])
                      if rt_arrival or rt_departure:
                          arrival_dt = rt_arrival or arrival_dt
                          departure_dt = rt_departure or departure_dt
                          source = "Estimación GTFS-RT"
                          realtime_used += 1

                  event_dt = arrival_dt or departure_dt
                  if not event_dt:
                      continue
                  if source == "Horario GTFS" and event_dt < now_local - timedelta(minutes=1):
                      source = "Horario GTFS · hora pasada"
                  output.append({
                      "stopId": row["stopId"],
                      "stopSequence": row["stopSequence"],
                      "name": row["name"] or row["stopId"] or "Parada sin nombre",
                      "arrivalTime": iso_local(arrival_dt),
                      "departureTime": iso_local(departure_dt),
                      "timeSource": source,
                      "status": status,
                  })
                  if len(output) >= 5:
                      break
              return output, realtime_used

          def extract_service_number(ref):
              # Many live VehicleJourneyRefs end with a route-specific code such as
              # O9SI3411_341102_12. The six-digit code repeats the four-digit route
              # code and adds a two-digit service number (02 -> Servicio 2).
              parts = (ref or "").split("_")
              for index in range(len(parts) - 1):
                  previous = parts[index]
                  route_match = re.search(r"(\d{4})$", previous) if previous.startswith("O") else None
                  candidate = parts[index + 1]
                  if route_match and re.fullmatch(r"\d{6}", candidate) and candidate.startswith(route_match.group(1)):
                      return str(int(candidate[-2:])), candidate
              return "", ""

          vehicles = []
          seen = set()
          joined_stops = 0
          joined_destinations = 0
          for index, activity in enumerate(activities, 1):
              journeys = [e for e in activity.iter() if local(e.tag) == "MonitoredVehicleJourney"]
              if not journeys:
                  continue
              journey = journeys[0]

              vehicle_id = value(journey, "VehicleRef", "VehicleIdentifier", "VehicleId", "FleetNumber")
              jref = value(journey, "VehicleJourneyRef", "DatedVehicleJourneyRef")
              if not jref:
                  jref = value(activity, "VehicleJourneyRef", "DatedVehicleJourneyRef")

              line_name = value(journey, "PublishedLineName", "LineName", "PublicLineCode", "LinePublicNumber")
              line_ref = value(journey, "LineRef", "LineReference")
              line = line_name or line_ref
              if not line and jref:
                  match = re.search(r"(?:^|_)([A-Z]\d{3,4})(?:_|$)", jref.upper())
                  if match:
                      line = match.group(1)
              if not line:
                  line = "Sin línea identificada"

              stop_id = value(journey, "StopPointRef", "StopPointId")
              stop_name = value(journey, "StopPointName")
              stop_item = stop_index.get(stop_id.lower()) if stop_id else None
              if not stop_item and stop_id:
                  numeric = re.fullmatch(r"0*(\d+)", stop_id.strip())
                  stop_item = stop_index.get(numeric.group(1)) if numeric else None
              if stop_item:
                  stop_name = stop_name or stop_item.get("name", "")
                  joined_stops += 1

              update = trip_updates.get(jref, {})
              gtfs = trips.get(jref, {}) or trips.get(jref[4:] if jref.startswith("trp_") else "trp_" + jref, {})
              gtfs_trip_id = gtfs.get("trip_id") or trip_id_by_ref.get(jref) or jref
              destination = value(journey, "DestinationName", "DestinationDisplay", "DestinationText", "JourneyEndName")
              destination_ref = value(journey, "DestinationRef")
              direction = value(journey, "DirectionName")
              destination_source = "SIRI" if destination else ""

              if not destination and update.get("destination"):
                  destination = update.get("destination", "")
                  destination_source = "Actualizaciones SIRI"
              if not destination and gtfs.get("headsign"):
                  destination = gtfs.get("headsign", "")
                  destination_source = "GTFS · horario"
              if not destination and direction:
                  destination = direction
                  destination_source = "Sentido SIRI"

              destination_ref = destination_ref or update.get("destinationRef", "")
              direction = direction or update.get("direction", "")
              if not destination and destination_ref:
                  dest_stop = stop_index.get(destination_ref.lower())
                  if dest_stop:
                      destination = dest_stop.get("name", "")
                      destination_source = "Directorio de paradas"
              if destination:
                  joined_destinations += 1

              arrival_status = value(journey, "ArrivalStatus") or value(journey, "DepartureStatus")
              upcoming_stops, realtime_stops_used = compose_upcoming_stops(jref, gtfs_trip_id, stop_id, arrival_status, vehicle_id)
              service_number, service_code = extract_service_number(jref)

              item = {
                  "id": vehicle_id or jref or ("Registro " + str(index)),
                  "idType": "ID de vehículo" if vehicle_id else ("Referencia de viaje (sin ID de vehículo)" if jref else "Identificador no publicado"),
                  "line": line,
                  "lineRef": line_ref,
                  "direction": direction,
                  "destination": destination,
                  "destinationSource": destination_source,
                  "destinationRef": destination_ref,
                  "tripId": gtfs_trip_id,
                  "tripShortName": gtfs.get("trip_short_name", ""),
                  "blockId": gtfs.get("block_id", ""),
                  "calendarServiceId": gtfs.get("service_id", ""),
                  "serviceNumber": service_number,
                  "serviceCode": service_code,
                  "upcomingStops": upcoming_stops,
                  "time": value(journey, "LocationRecordedAtTime", "RecordedAtTime") or value(activity, "RecordedAtTime", "ValidUntilTime"),
                  "stop": stop_id,
                  "stopName": stop_name,
                  "stopLat": (stop_item or {}).get("lat", ""),
                  "stopLon": (stop_item or {}).get("lon", ""),
                  "stopSource": stops_source if stop_item else "",
                  "journeyRef": jref,
                  "lat": value(journey, "Latitude"),
                  "lon": value(journey, "Longitude"),
              }
              key = (item["id"], item["line"], item["journeyRef"])
              if key not in seen:
                  seen.add(key)
                  vehicles.append(item)

          snapshot = {
              "sourceUrl": POSITIONS_URL,
              "tripUpdatesUrl": GTFS_RT_UPDATES_URL,
              "fetchedAt": NOW.isoformat(timespec="seconds"),
              "vehicleCount": len(vehicles),
              "stopLookupCount": len(stops),
              "stopMatches": joined_stops,
              "destinationMatches": joined_destinations,
              "vehicleBlocks": sum(1 for v in vehicles if v.get("blockId")),
              "tripShortNames": sum(1 for v in vehicles if v.get("tripShortName")),
              "vehiclesWithServiceNumber": sum(1 for v in vehicles if v.get("serviceNumber")),
              "vehiclesWithUpcomingStops": sum(1 for v in vehicles if v.get("upcomingStops")),
              "vehiclesWithRealtimeStopTimes": sum(1 for v in vehicles if any(s.get("timeSource") == "Estimación GTFS-RT" for s in v.get("upcomingStops", []))),
              "vehicles": vehicles,
          }

          # Save stops as a compact public dictionary as well as enriching every vehicle.
          if stops:
              with open("stops.json", "w", encoding="utf-8") as handle:
                  json.dump({
                      "fetchedAt": (NOW.isoformat(timespec="seconds") if stops_refreshed else stops_doc.get("fetchedAt", NOW.isoformat(timespec="seconds"))),
                      "cacheVersion": (STATIC_CACHE_VERSION if stops_refreshed else stops_doc.get("cacheVersion", "")),
                      "source": stops_source or stops_doc.get("source", ""),
                      "count": len(stops),
                      "stops": list(stops.values()),
                  }, handle, ensure_ascii=False, separators=(",", ":"))

          with open("vehicles.json", "w", encoding="utf-8") as handle:
              json.dump(snapshot, handle, ensure_ascii=False, indent=2)

          with open("vehicles-data.js", "w", encoding="utf-8") as handle:
              handle.write("window.BIZKAIBUS_DATA = ")
              json.dump(snapshot, handle, ensure_ascii=False, separators=(",", ":"))
              handle.write(";")

          print("SIRI: " + str(len(activities)) + " actividades; vehículos procesados: " + str(len(vehicles)))
          print("Paradas conocidas: " + str(len(stops)) + "; vehículos enlazados con nombre de parada: " + str(joined_stops))
          sources = {}
          for vehicle in vehicles:
              source = vehicle.get("destinationSource") or "sin destino"
              sources[source] = sources.get(source, 0) + 1
          print("Destinos encontrados: " + str(joined_destinations) + "; referencias SIRI con datos de destino: " + str(len(trip_updates)))
          print("Fuentes de destino: " + json.dumps(sources, ensure_ascii=False))
          print("Bloque de vehículo GTFS disponible: " + str(snapshot["vehicleBlocks"]) + "/" + str(len(vehicles)))
          print("Nombre corto de viaje GTFS disponible: " + str(snapshot["tripShortNames"]) + "/" + str(len(vehicles)))
          print("Número de servicio inferido del VehicleJourneyRef: " + str(snapshot["vehiclesWithServiceNumber"]) + "/" + str(len(vehicles)))
          print("Vehículos con próximas paradas: " + str(snapshot["vehiclesWithUpcomingStops"]) + "/" + str(len(vehicles)))
          print("Vehículos con al menos una hora estimada GTFS-RT: " + str(snapshot["vehiclesWithRealtimeStopTimes"]) + "/" + str(len(vehicles)))
          PY

      - name: Guardar los datos públicos si han cambiado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Los datos no han cambiado; no hay commit que crear."
          else
            git commit -m "Actualizar posiciones, paradas y destinos Bizkaibus"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
