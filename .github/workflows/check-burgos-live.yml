name: Validar web SAE de Burgos

on:
  push:
    paths:
      - "index.html"
      - "app.js"
      - "styles.css"
      - "burgos-data.json"
      - "burgos-modelos.json"
      - "scripts/update_burgos_gtfs.py"
      - "cloudflare-worker-burgos/src/index.js"
      - ".github/workflows/check-burgos-live.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar JavaScript de la web
        run: node --check app.js
      - name: Comprobar JavaScript del Worker de Burgos
        run: node --check cloudflare-worker-burgos/src/index.js
      - name: Validar base de modelos
        run: |
          node -e 'const d=require("./burgos-modelos.json"); const m=d.models; if (!m || !Object.keys(m).length || Object.values(m).some(v => typeof v !== "string" || !v.trim())) throw new Error("Base de modelos inválida"); console.log("Modelos válidos:", Object.keys(m).length);'
      - name: Validar estructura GTFS generada
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const d = JSON.parse(fs.readFileSync("burgos-data.json", "utf8"));
          for (const key of ["routes", "stops", "trips", "calendar", "exceptions"]) {
            if (!Array.isArray(d[key])) throw new Error("Falta el array " + key);
          }
          if (!d.routes.length || !d.stops.length || !d.trips.length) throw new Error("GTFS vacío");
          console.log("GTFS válido:", d.routes.length, "líneas,", d.stops.length, "paradas,", d.trips.length, "viajes");
          NODE
      - name: Comprobar sintaxis del importador GTFS
        run: python -m py_compile scripts/update_burgos_gtfs.py
