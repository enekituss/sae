name: Diagnóstico de fuentes públicas de Burgos

on:
  push:
    paths:
      - ".github/workflows/probe-burgos-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-public-app:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Inspeccionar recursos públicos de Bus Burgos
        shell: bash
        run: |
          python - <<'PY'
          import re
          import urllib.error
          import urllib.parse
          import urllib.request
          from html.parser import HTMLParser
          from concurrent.futures import ThreadPoolExecutor, as_completed

          ROOT = "https://webburgos.com/bus/"
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36",
              "Accept": "text/html,application/javascript,*/*",
              "Accept-Language": "es-ES,es;q=0.9,en;q=0.8"
          }

          class Assets(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.urls = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  candidate = attrs.get("src") or attrs.get("href")
                  if candidate and (candidate.endswith(".js") or ".js?" in candidate or attrs.get("rel") == "modulepreload"):
                      self.urls.append(candidate)

          def get(url, timeout=12):
              request = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(request, timeout=timeout) as response:
                  return response.status, response.geturl(), response.read()

          try:
              status, page_url, html_bytes = get(ROOT, 15)
              html = html_bytes.decode("utf-8", errors="replace")
              print("PAGE_STATUS:", status)
              print("PAGE_URL:", page_url)
              print("PAGE_BYTES:", len(html_bytes))
          except Exception as exc:
              print("PAGE_ERROR:", repr(exc))
              raise SystemExit(0)

          parser = Assets()
          parser.feed(html)
          assets = []
          for item in parser.urls:
              url = urllib.parse.urljoin(page_url, item)
              if url not in assets and urllib.parse.urlparse(url).scheme in ("http", "https"):
                  assets.append(url)
          print("JS_ASSETS:", len(assets))
          for url in assets[:30]:
              print("ASSET:", url)

          def inspect_asset(url):
              try:
                  status, resolved, raw = get(url, 12)
                  text = raw.decode("utf-8", errors="replace")
                  hits = set()
                  patterns = [
                      r"https?://[^\\s\"'<>\\)]+",
                      r"wss?://[^\\s\"'<>\\)]+",
                      r"/api/[A-Za-z0-9_./?=&%{}-]+",
                      r"[A-Za-z0-9_.-]+\\.(?:workers\\.dev|cloudflareworkers\\.com|firebaseio\\.com|pusherapp\\.com|pusher\.com|supabase\.co)"
                  ]
                  for pattern in patterns:
                      for match in re.findall(pattern, text, flags=re.I):
                          value = match.rstrip(";,")
                          if len(value) < 300:
                              hits.add(value)
                  keywords = []
                  for term in ("pusher", "websocket", "resourceVehicles", "resourceEstimations", "vehicles", "busPositions", "live", "realtime", "apiBase", "baseURL"):
                      idx = text.lower().find(term.lower())
                      if idx >= 0:
                          excerpt = re.sub(r"\\s+", " ", text[max(0, idx-120):idx+260])
                          # Avoid dumping long opaque strings or keys.
                          keywords.append(term + ": " + excerpt[:300])
                  return {"url":url,"status":status,"bytes":len(raw),"hits":sorted(hits)[:60],"keywords":keywords[:12],"error":""}
              except Exception as exc:
                  return {"url":url,"error":repr(exc)}

          with ThreadPoolExecutor(max_workers=5) as pool:
              futures = [pool.submit(inspect_asset, url) for url in assets[:30]]
              for future in as_completed(futures):
                  result = future.result()
                  print("ASSET_RESULT:", result)
          PY
