name: Diagnóstico de fuentes públicas de Burgos

on:
  push:
    paths:
      - ".github/workflows/probe-burgos-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-public-app:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Extraer rutas y canales públicos de Bus Burgos
        shell: bash
        run: |
          python - <<'PY'
          import re
          import urllib.parse
          import urllib.request
          from html.parser import HTMLParser

          ROOT = "https://webburgos.com/bus/"
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36",
              "Accept": "text/html,application/javascript,*/*"
          }

          class Assets(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.urls = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  candidate = attrs.get("src") or attrs.get("href")
                  if candidate and (candidate.endswith(".js") or ".js?" in candidate or attrs.get("rel") == "modulepreload"):
                      self.urls.append(candidate)

          def get(url, timeout=12):
              req = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=timeout) as res:
                  return res.geturl(), res.read()

          try:
              page_url, raw = get(ROOT, 12)
              html = raw.decode("utf-8", errors="replace")
          except Exception as exc:
              print("PAGE_ERROR:", repr(exc))
              raise SystemExit(0)

          parser = Assets()
          parser.feed(html)
          urls = list(dict.fromkeys(urllib.parse.urljoin(page_url, x) for x in parser.urls))
          js_urls = [u for u in urls if urllib.parse.urlparse(u).netloc == "webburgos.com"]
          print("APP_JS:", [u for u in js_urls if u.endswith(".js") or ".js?" in u])

          for url in js_urls:
              if not (url.endswith(".js") or ".js?" in url):
                  continue
              try:
                  resolved, raw = get(url, 12)
                  text = raw.decode("utf-8", errors="replace")
              except Exception as exc:
                  print("ASSET_ERROR:", url, repr(exc))
                  continue
              print("ASSET_OK:", url, "bytes=", len(raw))

              # API paths and action names embedded in the public JavaScript.
              action_literals = sorted(set(re.findall(r'''["'`]([^"'`]{0,160}(?:action=|/api/|\.php|\.json)[^"'`]{0,160})["'`]''', text, flags=re.I)))
              for value in action_literals[:100]:
                  if len(value) < 240:
                      print("ACTION_LITERAL:", value)

              # Show short snippets around transport/API and realtime wiring.
              terms = ("new Pusher(", "pusher.subscribe(", ".subscribe(", "llamarPusherGate", "iniciarPollingFallback", "fetch(", "XMLHttpRequest", "action=", "canalesSuscritos", "bind(")
              for term in terms:
                  positions = []
                  start = 0
                  while len(positions) < 8:
                      i = text.lower().find(term.lower(), start)
                      if i < 0:
                          break
                      positions.append(i)
                      start = i + len(term)
                  for i in positions:
                      excerpt = re.sub(r"\\s+", " ", text[max(0, i-180):i+360])
                      excerpt = re.sub(r'new Pusher\\([^,]+', 'new Pusher("[PUBLIC_KEY]"', excerpt)
                      print("SNIPPET", term, ":", excerpt[:520])
          PY