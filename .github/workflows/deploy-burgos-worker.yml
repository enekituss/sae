name: Validar Worker SAE de Burgos

on:
  push:
    branches:
      - main
    paths:
      - "cloudflare-worker-burgos/src/**"
      - "cloudflare-worker-burgos/wrangler.jsonc"
      - ".github/workflows/deploy-burgos-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Comprobar sintaxis del Worker
        run: node --check cloudflare-worker-burgos/src/index.js

      - name: Validar configuración Wrangler
        run: node -e "JSON.parse(require('node:fs').readFileSync('cloudflare-worker-burgos/wrangler.jsonc', 'utf8')); console.log('wrangler.jsonc válido')"

      - name: Información de despliegue
        run: |
          echo "Este workflow solo valida el código."
          echo "Cloudflare Workers Builds despliega burgos-sae-spotter desde la integración GitHub conectada."
