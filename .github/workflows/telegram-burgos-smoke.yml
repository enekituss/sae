name: Diagnóstico Telegram · Autobuses de Burgos
# Reprueba el endpoint de ISAENEXT y el estado actual de secretos de Cloudflare.

on:
  push:
    paths:
      - ".github/workflows/telegram-burgos-smoke.yml"
      - ".github/workflows/telegram-burgos.yml"
      - "cloudflare-worker-burgos/src/index.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Comprobar token, webhook y fuente de autobuses sin enviar mensajes
        env:
          BURGOS_TELEGRAM_BOT_TOKEN: ${{ secrets.BURGOS_TELEGRAM_BOT_TOKEN }}
          BURGOS_TELEGRAM_CHAT_ID: ${{ secrets.BURGOS_TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          token = (os.environ.get("BURGOS_TELEGRAM_BOT_TOKEN") or "").strip()
          chat_id = (os.environ.get("BURGOS_TELEGRAM_CHAT_ID") or "").strip()
          failures = []

          if not token or not chat_id:
              print("FALLO: faltan BURGOS_TELEGRAM_BOT_TOKEN o BURGOS_TELEGRAM_CHAT_ID en GitHub Actions.")
              sys.exit(1)

          def telegram(method, payload=None):
              url = "https://api.telegram.org/bot" + token + "/" + method
              body = json.dumps(payload or {}).encode("utf-8")
              request = urllib.request.Request(
                  url, data=body,
                  headers={"Content-Type": "application/json", "User-Agent": "SAE-Burgos-Diagnostics/1.0"},
                  method="POST"
              )
              with urllib.request.urlopen(request, timeout=12) as response:
                  return json.loads(response.read().decode("utf-8"))

          try:
              me = telegram("getMe")
              if not me.get("ok"):
                  raise RuntimeError("Telegram getMe devolvió ok=false")
              print("OK: token de Telegram válido para @" + str((me.get("result") or {}).get("username") or "bot"))
          except Exception as exc:
              failures.append("Token de Telegram: " + str(exc))
              print("FALLO: token de Telegram: " + str(exc))

          try:
              chat = telegram("getChat", {"chat_id": chat_id})
              if not chat.get("ok"):
                  raise RuntimeError("Telegram no reconoce el chat configurado")
              print("OK: BURGOS_TELEGRAM_CHAT_ID es accesible (ID oculto).")
          except Exception as exc:
              failures.append("Chat de Telegram: " + str(exc))
              print("FALLO: chat de Telegram: " + str(exc))

          try:
              webhook = telegram("getWebhookInfo").get("result") or {}
              url = str(webhook.get("url") or "")
              expected = "https://bizkaibus-sae-dispatcher.ecanteroalvarez.workers.dev/telegram/burgos"
              if url == expected:
                  print("OK: webhook de Burgos registrado en Cloudflare.")
              elif not url:
                  print("AVISO: webhook de menú sin registrar; las alertas por comparación del SAE pueden comprobarse igualmente.")
              else:
                  print("AVISO: webhook de menú apunta a otra URL: " + url)
              if webhook.get("last_error_message"):
                  print("AVISO de Telegram webhook: " + str(webhook.get("last_error_message"))[:300])
          except Exception as exc:
              failures.append("Webhook de Telegram: " + str(exc))
              print("FALLO: no se pudo comprobar el webhook: " + str(exc))

          shared_base = "https://bizkaibus-sae-dispatcher.ecanteroalvarez.workers.dev"
          try:
              request = urllib.request.Request(shared_base + "/health", headers={"User-Agent": "SAE-Burgos-Diagnostics/1.0"})
              with urllib.request.urlopen(request, timeout=10) as response:
                  shared_health = json.loads(response.read().decode("utf-8"))
              flags = shared_health.get("telegramSecretStatus") or {}
              print("Worker de menús Telegram responde.")
              print("Secret GITHUB_TOKEN presente: " + str(bool(flags.get("githubToken"))))
              print("Secret TELEGRAM_WEBHOOK_SECRET presente: " + str(bool(flags.get("webhookSecret"))))
              print("Secret TELEGRAM_BURGOS_BOT_TOKEN presente: " + str(bool(flags.get("burgosBotToken"))))
              if not flags.get("githubToken"):
                  print("AVISO: falta GITHUB_TOKEN en el Worker de menús; no es requisito para consultar el SAE oficial.")
              if not flags.get("webhookSecret"):
                  print("AVISO: falta TELEGRAM_WEBHOOK_SECRET; afecta al webhook de menú, no a la comparación del SAE.")
              if not flags.get("burgosBotToken"):
                  print("AVISO: falta TELEGRAM_BURGOS_BOT_TOKEN en el Worker de menús; el monitor usa el token de GitHub Actions.")
          except Exception as exc:
              print("AVISO: Worker de menús Telegram no disponible (no bloquea la prueba de lectura del SAE): " + str(exc))

          worker_base = "https://burgos-sae-spotter.ecanteroalvarez.workers.dev"
          try:
              request = urllib.request.Request(worker_base + "/health", headers={"User-Agent": "SAE-Burgos-Diagnostics/1.0"})
              with urllib.request.urlopen(request, timeout=10) as response:
                  health = json.loads(response.read().decode("utf-8"))
              scheduler = health.get("telegramScheduler") or {}
              print("OK: Worker independiente de Burgos responde en /health.")
              print("Programador BURGOS_GITHUB_TOKEN configurado: " + str(bool(scheduler.get("configured"))))
              print("Fuente declarada por el Worker: " + str(health.get("source") or "No indicada"))
              if not scheduler.get("configured"):
                  failures.append("Falta BURGOS_GITHUB_TOKEN en el Worker burgos-sae-spotter.")
          except Exception as exc:
              failures.append("Health del Worker de Burgos: " + str(exc))
              print("FALLO: Worker de Burgos: " + str(exc))

          source_errors = []
          worker_source_ok = False
          direct_source_ok = False

          # Primero se comprueba el snapshot oficial de estimaciones, que es la fuente
          # que ahora prioriza el monitor de cambios.
          try:
              request = urllib.request.Request(
                  worker_base + "/api/burgos/live?fresh=1",
                  headers={"Accept": "application/json", "Cache-Control": "no-cache", "User-Agent": "SAE-Burgos-Diagnostics/1.0"}
              )
              with urllib.request.urlopen(request, timeout=70) as response:
                  live = json.loads(response.read().decode("utf-8"))
              if live.get("ok") is not True or not isinstance(live.get("observations"), list):
                  raise RuntimeError(str(live.get("error") or "respuesta sin observaciones del SAE"))
              total_groups = int(live.get("totalGroups") or 0)
              completed_groups = int(live.get("completedGroups") or 0)
              if live.get("partial") or (total_groups and completed_groups != total_groups):
                  raise RuntimeError("snapshot parcial: " + str(completed_groups) + "/" + str(total_groups) + " grupos")
              observations = live.get("observations") or []
              vehicle_ids = {
                  str(item.get("vehicleId") or item.get("vehicle") or item.get("vehicle_id") or "").strip()
                  for item in observations if isinstance(item, dict)
              }
              vehicle_ids.discard("")
              vehicle_ids.discard("0")
              if not vehicle_ids:
                  print("AVISO: el Worker leyó las estimaciones, pero ahora no hay IDs de autobús identificables.")
              else:
                  print("OK: SAE por estimaciones a través del Worker; " + str(len(vehicle_ids)) + " IDs identificables, " + str(len(observations)) + " observaciones.")
              worker_source_ok = True
          except Exception as exc:
              source_errors.append("Worker /api/burgos/live: " + str(exc))
              print("AVISO: lectura del SAE mediante Worker falló: " + str(exc))

          # Comprobación directa de los recursos oficiales: probar el mismo patrón
          # que usa el monitor, con resourceEstimations y line=01.
          official_pages = [
              "https://movilidad.aytoburgos.es/es/rutas-en-directo",
              "https://movilidad.aytoburgos.es/rutas-en-directo",
              "https://www.aytoburgos.es/web/movilidad/rutas-en-directo"
          ]

          def official_resource(resource, extra=None):
              params = {
                  "p_p_id": "as_asac_isaenext_IsaenextWebPortlet",
                  "p_p_lifecycle": "2",
                  "p_p_state": "normal",
                  "p_p_mode": "view",
                  "p_p_resource_id": resource,
                  "p_p_cacheability": "cacheLevelPage"
              }
              if extra:
                  params.update(extra)
              errors = []
              for page in official_pages:
                  request_url = page + "?" + urllib.parse.urlencode(params)
                  request = urllib.request.Request(
                      request_url,
                      headers={
                          "Accept": "application/json, text/plain, */*",
                          "Cache-Control": "no-cache",
                          "Referer": "https://movilidad.aytoburgos.es/es/rutas-en-directo",
                          "User-Agent": "Mozilla/5.0 (compatible; SAE-Burgos-Diagnostics/1.0)"
                      }
                  )
                  try:
                      with urllib.request.urlopen(request, timeout=15) as response:
                          return json.loads(response.read().decode("utf-8"))
                  except Exception as exc:
                      errors.append(urllib.parse.urlparse(page).netloc + ": " + str(exc)[:120])
              raise RuntimeError(resource + " no respondió: " + " | ".join(errors))

          try:
              # Misma consulta por línea y lista de IDs que figura en la URL aportada.
              stop_ids = ["402", "183", "209", "98", "26", "224", "71", "152", "164", "227", "228"]
              print("Probando resourceEstimations directamente con line=01 y " + str(len(stop_ids)) + " IDs de parada.")
              estimations = official_resource("resourceEstimations", {
                  "_as_asac_isaenext_IsaenextWebPortlet_line": "01",
                  "_as_asac_isaenext_IsaenextWebPortlet_tipo": "1",
                  "_as_asac_isaenext_IsaenextWebPortlet_nodoIds": ",".join(stop_ids)
              })
              if not isinstance(estimations, list):
                  raise RuntimeError("resourceEstimations no devolvió una lista")
              routes_count = 0
              ids_seen = set()
              for stop in estimations:
                  if not isinstance(stop, dict):
                      continue
                  for route in (stop.get("routeEstimationByNode") or stop.get("routes") or []):
                      if not isinstance(route, dict):
                          continue
                      routes_count += 1
                      for item in (route.get("publicEstimationVHExts") or route.get("estimations") or []):
                          if isinstance(item, dict):
                              vehicle_id = str(item.get("vehicle") or item.get("vehicleId") or item.get("vehicle_id") or "").strip()
                              if vehicle_id and vehicle_id != "0":
                                  ids_seen.add(vehicle_id)
              print("OK: resourceEstimations con line=01 responde; " + str(len(estimations)) + " resultados de parada, " + str(routes_count) + " grupos de línea y " + str(len(ids_seen)) + " IDs identificables.")
              direct_source_ok = True
          except Exception as exc:
              source_errors.append("SAE oficial directo por línea: " + str(exc))
              print("AVISO: consulta directa del SAE por línea falló: " + str(exc))

          if not (worker_source_ok or direct_source_ok):
              failures.append("No se pudo leer ninguna fuente del SAE oficial. " + " | ".join(source_errors))

          if failures:
              print("\nRESULTADO: todavía no está listo el circuito completo.")
              for failure in failures:
                  print("- " + failure)
              sys.exit(1)
          print("\nRESULTADO: configuración de Telegram y consulta del SAE oficial superaron el diagnóstico.")
          PY
