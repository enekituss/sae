name: Diagnóstico Telegram · Autobuses de Burgos
# Reprueba el endpoint de ISAENEXT y el estado actual de secretos de Cloudflare.

on:
  workflow_dispatch:
  # Revalidar el Worker al cambiar su fuente o este diagnóstico.
  push:
    paths:
      - ".github/workflows/telegram-burgos-smoke.yml"
      - "cloudflare-worker-burgos/src/index.js"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Comprobar token, webhook y fuente de autobuses sin enviar mensajes
        env:
          BURGOS_TELEGRAM_BOT_TOKEN: ${{ secrets.BURGOS_TELEGRAM_BOT_TOKEN }}
          BURGOS_TELEGRAM_CHAT_ID: ${{ secrets.BURGOS_TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          token = (os.environ.get("BURGOS_TELEGRAM_BOT_TOKEN") or "").strip()
          chat_id = (os.environ.get("BURGOS_TELEGRAM_CHAT_ID") or "").strip()
          failures = []

          if not token or not chat_id:
              print("FALLO: faltan BURGOS_TELEGRAM_BOT_TOKEN o BURGOS_TELEGRAM_CHAT_ID en GitHub Actions.")
              sys.exit(1)

          def telegram(method, payload=None):
              url = "https://api.telegram.org/bot" + token + "/" + method
              body = json.dumps(payload or {}).encode("utf-8")
              request = urllib.request.Request(
                  url, data=body,
                  headers={"Content-Type": "application/json", "User-Agent": "SAE-Burgos-Diagnostics/1.0"},
                  method="POST"
              )
              with urllib.request.urlopen(request, timeout=12) as response:
                  return json.loads(response.read().decode("utf-8"))

          try:
              me = telegram("getMe")
              if not me.get("ok"):
                  raise RuntimeError("Telegram getMe devolvió ok=false")
              username = str((me.get("result") or {}).get("username") or "")
              if username.lower() != "saebur_bot":
                  raise RuntimeError("el token pertenece a @" + (username or "sin username") + ", no al bot independiente @SAEBUR_bot")
              print("OK: token válido para el bot independiente @SAEBUR_bot")
          except Exception as exc:
              failures.append("Token de Telegram: " + str(exc))
              print("FALLO: token de Telegram: " + str(exc))

          try:
              chat = telegram("getChat", {"chat_id": chat_id})
              if not chat.get("ok"):
                  raise RuntimeError("Telegram no reconoce el chat configurado")
              print("OK: BURGOS_TELEGRAM_CHAT_ID es accesible (ID oculto).")
          except Exception as exc:
              failures.append("Chat de Telegram: " + str(exc))
              print("FALLO: chat de Telegram: " + str(exc))

          try:
              webhook = telegram("getWebhookInfo").get("result") or {}
              url = str(webhook.get("url") or "")
              if url:
                  print("AVISO: @SAEBUR_bot todavía tiene un webhook instalado; el monitor de Burgos lo retirará tras validar el token.")
              else:
                  print("OK: no hay webhook; Burgos puede procesar sus preferencias mediante getUpdates.")
              if webhook.get("last_error_message"):
                  print("AVISO de Telegram webhook: " + str(webhook.get("last_error_message"))[:300])
          except Exception as exc:
              failures.append("Estado del webhook de Telegram: " + str(exc))
              print("FALLO: no se pudo comprobar el estado del webhook: " + str(exc))

          worker_base = "https://burgos-sae-spotter.ecanteroalvarez.workers.dev"

          # Comprueba que el endpoint de Burgos responde y publica el build esperado.
          try:
              request = urllib.request.Request(
                  worker_base + "/health",
                  headers={"User-Agent": "SAE-Burgos-Diagnostics/1.0"}
              )
              with urllib.request.urlopen(request, timeout=12) as response:
                  health = json.loads(response.read().decode("utf-8"))
              if health.get("ok") is not True or "burgos" not in str(health.get("service") or "").lower():
                  raise RuntimeError("el /health no identifica al Worker independiente de Burgos")
              api_version = str(health.get("apiVersion") or "")
              build_id = str(health.get("buildId") or "")
              print("OK: Worker independiente de Burgos responde en /health.")
              print("Versión API: " + (api_version or "no indicada"))
              print("Build desplegado: " + (build_id or "sin etiqueta"))
              if api_version != "sae-three-resources-per-line-v6":
                  failures.append("Versión inesperada del Worker de Burgos: " + (api_version or "sin versión"))
                  print("FALLO: versión API no compatible.")
              expected_build = "burgos-live-v6.8-2026-10-19"
              if build_id != expected_build:
                  failures.append(
                      "El Worker de Cloudflare sigue desplegado en " + (build_id or "un build sin identificar") +
                      "; debe desplegarse " + expected_build + " desde cloudflare-worker-burgos."
                  )
                  print("FALLO: falta desplegar la revisión nueva del Worker de Burgos en Cloudflare.")
              else:
                  print("OK: el build v6.8 con la ruta ISAENEXT /web/movilidad y respaldo mediante proxies está desplegado.")
              scheduler = health.get("telegramScheduler") or {}
              if scheduler.get("configured"):
                  print("OK: BURGOS_GITHUB_TOKEN está configurado; programador del Worker activo cada 2 minutos.")
              else:
                  print("AVISO: falta BURGOS_GITHUB_TOKEN en el Worker de Cloudflare; las alertas siguen con el respaldo de GitHub Actions cada 5 minutos, pero no hay disparo del Worker cada 2 minutos.")
          except Exception as exc:
              failures.append("Health del Worker independiente de Burgos: " + str(exc))
              print("FALLO: Worker de Burgos: " + str(exc))

          # No se diagnostica la red consultando una sola línea: una línea puede
          # fallar aunque las otras estén disponibles. Se prueban hasta cinco líneas.
          probe_lines = ["01", "02", "03", "05", "C2"]
          successful_line = ""
          vehicles_payload = None
          source_errors = []
          for line in probe_lines:
              try:
                  vehicle_url = worker_base + "/api/burgos/vehicles?" + urllib.parse.urlencode({
                      "line": line
                  })
                  request = urllib.request.Request(
                      vehicle_url,
                      headers={
                          "Accept": "application/json",
                          "User-Agent": "SAE-Burgos-Diagnostics/1.0"
                      }
                  )
                  with urllib.request.urlopen(request, timeout=45) as response:
                      payload = json.loads(response.read().decode("utf-8"))
                  if payload.get("ok") is not True or not isinstance(payload.get("vehicles"), list):
                      raise RuntimeError(str(payload.get("error") or "respuesta sin lista de autobuses"))
                  if payload.get("stale"):
                      raise RuntimeError("el Worker solo pudo ofrecer datos guardados antiguos; no se consideran conexión en tiempo real")
                  if "resourceVehicles" not in str(payload.get("sourceType") or ""):
                      raise RuntimeError("el endpoint no confirma resourceVehicles")
                  successful_line = line
                  vehicles_payload = payload
                  print("OK: conexión actual con resourceVehicles para línea " + line +
                        " (" + str(len(payload["vehicles"])) + " autobuses).")
                  break
              except urllib.error.HTTPError as exc:
                  try:
                      body = json.loads(exc.read().decode("utf-8", errors="replace"))
                      detail = str(body.get("error") or body.get("message") or "")[:350]
                  except Exception:
                      detail = ""
                  message = "línea " + line + " HTTP " + str(exc.code) + (": " + detail if detail else "")
                  source_errors.append(message)
                  print("AVISO: " + message)
              except Exception as exc:
                  message = "línea " + line + ": " + str(exc)
                  source_errors.append(message)
                  print("AVISO: " + message)

          if not successful_line:
              failure = "No hubo conexión actual con resourceVehicles en las líneas probadas. " + " | ".join(source_errors[:5])
              failures.append(failure)
              print("FALLO: " + failure)

          # /live es un enriquecimiento opcional. Si el Ayuntamiento no publica el
          # trazado o las estimaciones, el listado de coches debe seguir funcionando.
          if successful_line:
              try:
                  live_url = worker_base + "/api/burgos/live?" + urllib.parse.urlencode({
                      "line": successful_line,
                      "fresh": "1",
                      "_t": "diagnostic-live"
                  })
                  request = urllib.request.Request(
                      live_url,
                      headers={
                          "Accept": "application/json",
                          "Cache-Control": "no-cache",
                          "User-Agent": "SAE-Burgos-Diagnostics/1.0"
                      }
                  )
                  with urllib.request.urlopen(request, timeout=60) as response:
                      live_payload = json.loads(response.read().decode("utf-8"))
                  if live_payload.get("ok") is not True or not isinstance(live_payload.get("vehicles"), list):
                      raise RuntimeError(str(live_payload.get("error") or "respuesta sin lista de autobuses"))
                  if not isinstance(live_payload.get("observations"), list):
                      raise RuntimeError("respuesta sin lista de estimaciones")
                  if live_payload.get("partial"):
                      warnings = live_payload.get("warnings") or []
                      print("AVISO: /live conserva los autobuses de la línea " + successful_line +
                            " pero faltan datos complementarios: " + "; ".join(str(item) for item in warnings)[:500])
                  else:
                      print("OK: /live devuelve recorrido, coches y estimaciones para la línea " + successful_line + ".")
              except Exception as exc:
                  print("AVISO: el enriquecimiento /live no está disponible ahora: " + str(exc) +
                        ". La conexión ligera de vehículos se ha comprobado por separado.")

          if failures:
              print("\nRESULTADO: todavía no está listo el circuito completo.")
              for failure in failures:
                  print("- " + failure)
              sys.exit(1)
          print("\nRESULTADO: configuración de Telegram y consulta del SAE oficial superaron el diagnóstico.")
          PY
