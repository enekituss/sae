name: Diagnóstico Telegram · Autobuses de Burgos
# Reprueba el endpoint de ISAENEXT y el estado actual de secretos de Cloudflare.

on:
  push:
    paths:
      - ".github/workflows/telegram-burgos-smoke.yml"
      - ".github/workflows/telegram-burgos.yml"
      - "cloudflare-worker-burgos/src/index.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Comprobar token, webhook y fuente de autobuses sin enviar mensajes
        env:
          BURGOS_TELEGRAM_BOT_TOKEN: ${{ secrets.BURGOS_TELEGRAM_BOT_TOKEN }}
          BURGOS_TELEGRAM_CHAT_ID: ${{ secrets.BURGOS_TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          token = (os.environ.get("BURGOS_TELEGRAM_BOT_TOKEN") or "").strip()
          chat_id = (os.environ.get("BURGOS_TELEGRAM_CHAT_ID") or "").strip()
          failures = []

          if not token or not chat_id:
              print("FALLO: faltan BURGOS_TELEGRAM_BOT_TOKEN o BURGOS_TELEGRAM_CHAT_ID en GitHub Actions.")
              sys.exit(1)

          def telegram(method, payload=None):
              url = "https://api.telegram.org/bot" + token + "/" + method
              body = json.dumps(payload or {}).encode("utf-8")
              request = urllib.request.Request(
                  url, data=body,
                  headers={"Content-Type": "application/json", "User-Agent": "SAE-Burgos-Diagnostics/1.0"},
                  method="POST"
              )
              with urllib.request.urlopen(request, timeout=12) as response:
                  return json.loads(response.read().decode("utf-8"))

          try:
              me = telegram("getMe")
              if not me.get("ok"):
                  raise RuntimeError("Telegram getMe devolvió ok=false")
              username = str((me.get("result") or {}).get("username") or "")
              if username.lower() != "saebur_bot":
                  raise RuntimeError("el token pertenece a @" + (username or "sin username") + ", no al bot independiente @SAEBUR_bot")
              print("OK: token válido para el bot independiente @SAEBUR_bot")
          except Exception as exc:
              failures.append("Token de Telegram: " + str(exc))
              print("FALLO: token de Telegram: " + str(exc))

          try:
              chat = telegram("getChat", {"chat_id": chat_id})
              if not chat.get("ok"):
                  raise RuntimeError("Telegram no reconoce el chat configurado")
              print("OK: BURGOS_TELEGRAM_CHAT_ID es accesible (ID oculto).")
          except Exception as exc:
              failures.append("Chat de Telegram: " + str(exc))
              print("FALLO: chat de Telegram: " + str(exc))

          try:
              webhook = telegram("getWebhookInfo").get("result") or {}
              url = str(webhook.get("url") or "")
              if url:
                  print("AVISO: @SAEBUR_bot todavía tiene un webhook instalado; el monitor de Burgos lo retirará tras validar el token.")
              else:
                  print("OK: no hay webhook; Burgos puede procesar sus preferencias mediante getUpdates.")
              if webhook.get("last_error_message"):
                  print("AVISO de Telegram webhook: " + str(webhook.get("last_error_message"))[:300])
          except Exception as exc:
              failures.append("Estado del webhook de Telegram: " + str(exc))
              print("FALLO: no se pudo comprobar el estado del webhook: " + str(exc))

          worker_base = "https://burgos-sae-spotter.ecanteroalvarez.workers.dev"
          # Primero prueba la lista ligera, cuyo origen es resourceVehicles.
          try:
              vehicle_url = worker_base + "/api/burgos/vehicles?" + urllib.parse.urlencode({
                  "line": "01",
                  "fresh": "1",
                  "_t": "diagnostic-vehicles"
              })
              request = urllib.request.Request(
                  vehicle_url,
                  headers={
                      "Accept": "application/json",
                      "Cache-Control": "no-cache",
                      "User-Agent": "SAE-Burgos-Diagnostics/1.0"
                  }
              )
              with urllib.request.urlopen(request, timeout=45) as response:
                  vehicles_payload = json.loads(response.read().decode("utf-8"))
              if vehicles_payload.get("ok") is not True or not isinstance(vehicles_payload.get("vehicles"), list):
                  raise RuntimeError(str(vehicles_payload.get("error") or "respuesta sin lista de autobuses"))
              vehicle_source = str(vehicles_payload.get("sourceType") or "")
              if "resourceVehicles" not in vehicle_source:
                  raise RuntimeError("el endpoint de lista no confirma resourceVehicles")
              print("OK: la lista ligera consulta resourceVehicles por línea.")
              print("Autobuses de línea 01: " + str(len(vehicles_payload["vehicles"])) + ".")
          except urllib.error.HTTPError as exc:
              try:
                  body = json.loads(exc.read().decode("utf-8", errors="replace"))
                  detail = str(body.get("error") or body.get("message") or "")[:500]
              except Exception:
                  detail = ""
              message = "HTTP " + str(exc.code) + (": " + detail if detail else "")
              failures.append("Lista de autobuses (line=01): " + message)
              print("FALLO: lista de autobuses: " + message)
          except Exception as exc:
              failures.append("Lista de autobuses (line=01): " + str(exc))
              print("FALLO: lista de autobuses: " + str(exc))

          # El endpoint /live es el que consulta los tres recursos municipales.
          try:
              live_url = worker_base + "/api/burgos/live?" + urllib.parse.urlencode({
                  "line": "01",
                  "fresh": "1",
                  "_t": "diagnostic-live"
              })
              request = urllib.request.Request(
                  live_url,
                  headers={
                      "Accept": "application/json",
                      "Cache-Control": "no-cache",
                      "User-Agent": "SAE-Burgos-Diagnostics/1.0"
                  }
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  live_payload = json.loads(response.read().decode("utf-8"))
              if live_payload.get("ok") is not True or not isinstance(live_payload.get("vehicles"), list):
                  raise RuntimeError(str(live_payload.get("error") or "respuesta sin lista de autobuses"))
              if not isinstance(live_payload.get("observations"), list):
                  raise RuntimeError("respuesta sin lista de estimaciones")
              source_type = str(live_payload.get("sourceType") or "")
              required_resources = ("resourceRoutes", "resourceVehicles", "resourceEstimations")
              missing_resources = [resource for resource in required_resources if resource not in source_type]
              if missing_resources:
                  raise RuntimeError("el endpoint /live no confirma los tres recursos: " + ", ".join(missing_resources))
              print("OK: Worker consultó los tres recursos oficiales para line=01.")
              print("Paradas de resourceRoutes: " + str(live_payload.get("routeStopCount") or 0))
              print("Filas de resourceVehicles: " + str(live_payload.get("vehicleRowCount") or 0))
              print("Observaciones de resourceEstimations: " + str(live_payload.get("estimationCount") or 0))
              print("Autobuses combinados en /live: " + str(len(live_payload["vehicles"])) + ".")
          except urllib.error.HTTPError as exc:
              try:
                  body = json.loads(exc.read().decode("utf-8", errors="replace"))
                  detail = str(body.get("error") or body.get("message") or "")[:500]
              except Exception:
                  detail = ""
              message = "HTTP " + str(exc.code) + (": " + detail if detail else "")
              print("AVISO: enriquecimiento /live no disponible ahora: " + message +
                  ". Las alertas básicas pueden funcionar con resourceVehicles.")
          except Exception as exc:
              print("AVISO: enriquecimiento /live no disponible ahora: " + str(exc) +
                  ". Las alertas básicas pueden funcionar con resourceVehicles.")

          if failures:
              print("\nRESULTADO: todavía no está listo el circuito completo.")
              for failure in failures:
                  print("- " + failure)
              sys.exit(1)
          print("\nRESULTADO: configuración de Telegram y consulta del SAE oficial superaron el diagnóstico.")
          PY
